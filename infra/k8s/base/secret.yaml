apiVersion: v1
kind: Secret
metadata:
  name: pjb-backend-secret
type: Opaque
stringData:
  # ── Banco de dados ──────────────────────────────────────────────────────────
  SPRING_DATASOURCE_PASSWORD: REPLACE_ME

  # ── Criptografia interna ─────────────────────────────────────────────────────
  PJB_MASTER_KEY_BASE64: REPLACE_ME

  # ── Gov.br OAuth2 (IDP federal) ──────────────────────────────────────────────
  PJB_GOVBR_CLIENT_ID: REPLACE_ME
  PJB_GOVBR_CLIENT_SECRET: REPLACE_ME
  PJB_GOVBR_JWKS_URL: REPLACE_ME
  PJB_GOVBR_ISSUER: REPLACE_ME

  # ── HSM / ICP-Brasil ─────────────────────────────────────────────────────────
  PJB_HSM_PIN: REPLACE_ME
  PJB_HSM_TRUST_STORE_PASSWORD: REPLACE_ME

  # ── Integrações judiciais externas ───────────────────────────────────────────
  PJB_SISBAJUD_TOKEN: REPLACE_ME
  PJB_RENAJUD_TOKEN: REPLACE_ME
  PJB_INFOJUD_TOKEN: REPLACE_ME

  # ── APIs de IA (opcionais em prod) ───────────────────────────────────────────
  OPENAI_API_KEY: REPLACE_ME
  ANTHROPIC_API_KEY: REPLACE_ME
  GOOGLE_API_KEY: REPLACE_ME

  # ── n8n integração de automação (opcional) ───────────────────────────────────
  PJB_N8N_DISPATCH_SECRET: REPLACE_ME
  PJB_N8N_INBOUND_SECRET: REPLACE_ME

  # ── Edge app (origin governance) ─────────────────────────────────────────────
  PJB_SECURITY_PERIMETER_EDGE_APP_SECRET: REPLACE_ME
