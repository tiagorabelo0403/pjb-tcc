apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
maxPods: 110
kubeReserved:
  cpu: 500m
  memory: 1Gi
  ephemeral-storage: 2Gi
systemReserved:
  cpu: 500m
  memory: 1Gi
  ephemeral-storage: 2Gi
evictionHard:
  memory.available: 500Mi
  nodefs.available: 10%
  imagefs.available: 15%
