apiVersion: v1
kind: LimitRange
metadata:
  name: pjb-operational-guards
spec:
  limits:
    - type: Container
      min:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 256Mi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 512Mi
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 1Gi
      max:
        cpu: "8"
        memory: 8Gi
        ephemeral-storage: 8Gi
      maxLimitRequestRatio:
        cpu: "4"
        memory: "4"
    - type: Pod
      max:
        cpu: "16"
        memory: 16Gi
        ephemeral-storage: 16Gi
