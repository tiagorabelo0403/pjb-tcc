apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: FlowSchema
metadata:
  name: pjb-service-accounts-workload
spec:
  distinguisherMethod:
    type: ByUser
  matchingPrecedence: 800
  priorityLevelConfiguration:
    name: pjb-platform-workload
  rules:
    - subjects:
        - kind: Group
          group:
            name: system:serviceaccounts:pjb
      resourceRules:
        - verbs:
            - get
            - list
            - watch
            - create
            - update
            - patch
            - delete
          apiGroups:
            - "*"
          resources:
            - "*"
          namespaces:
            - pjb
