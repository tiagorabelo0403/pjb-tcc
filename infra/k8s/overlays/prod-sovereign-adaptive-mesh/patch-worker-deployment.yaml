apiVersion: apps/v1
kind: Deployment
metadata:
  name: pjb-worker
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: pjb
        pjb.scale/profile: adaptive-processual
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: worker
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: worker
