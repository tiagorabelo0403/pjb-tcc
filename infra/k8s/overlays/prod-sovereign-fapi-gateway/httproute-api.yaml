apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pjb-api-route
  namespace: pjb
spec:
  parentRefs:
    - name: pjb-sovereign-gateway
  hostnames:
    - api.pjb.jus.br
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      backendRefs:
        - name: pjb-api
          port: 80
