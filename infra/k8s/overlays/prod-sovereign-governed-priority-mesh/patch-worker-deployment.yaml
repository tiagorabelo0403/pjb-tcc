apiVersion: apps/v1
kind: Deployment
metadata:
  name: pjb-worker
spec:
  template:
    metadata:
      labels:
        pjb.governance/tier: processual-execution
        pjb.priority/profile: judicial-class-aware
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: pjb.io/processual
          operator: Equal
          value: governed
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: pjb.io/node-plane
                    operator: In
                    values:
                      - processual
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: worker
