apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: pjb-worker
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pjb-worker
  updatePolicy:
    updateMode: Initial
  resourcePolicy:
    containerPolicies:
      - containerName: backend
        controlledResources:
          - cpu
          - memory
        minAllowed:
          cpu: 500m
          memory: 1Gi
        maxAllowed:
          cpu: "8"
          memory: 10Gi
