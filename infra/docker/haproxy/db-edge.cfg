global
    log stdout format raw local0
    maxconn 16000

defaults
    log global
    mode tcp
    option dontlognull
    timeout connect 5s
    timeout client  120s
    timeout server  120s

frontend pjb_db_rw
    bind *:6432
    default_backend pjb_db_rw_backend

frontend pjb_db_ro
    bind *:6433
    default_backend pjb_db_ro_backend

backend pjb_db_rw_backend
    balance first
    option tcp-check
    default-server inter 3s fall 3 rise 2
    server pgbouncer_rw pgbouncer-rw:6432 check

backend pjb_db_ro_backend
    balance leastconn
    option tcp-check
    default-server inter 3s fall 3 rise 2
    server pgbouncer_ro pgbouncer-ro:6432 check
    server pgbouncer_rw_backup pgbouncer-rw:6432 check backup
