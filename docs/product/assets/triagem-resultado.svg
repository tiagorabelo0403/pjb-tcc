<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Resultado da Triagem Nacional exibido ao advogado após o envio da petição</title>
  <desc id="desc">Mockup de interface mostrando o resultado devolvido pela Triagem Nacional: veredito, confiança geral, análise de prescrição, competência sugerida, pendências detectadas e processos conexos suspeitos, com base nos campos reais de ResultadoTriagem.</desc>

  <defs>
    <filter id="sombra2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1240" height="680" rx="14" fill="#12172a" stroke="#2a3350" stroke-width="1" filter="url(#sombra2)"/>
  <rect x="20" y="20" width="1240" height="56" rx="14" fill="#0d1120"/>
  <rect x="20" y="60" width="1240" height="16" fill="#0d1120"/>
  <circle cx="46" cy="48" r="6" fill="#e05252"/>
  <circle cx="66" cy="48" r="6" fill="#e0b84f"/>
  <circle cx="86" cy="48" r="6" fill="#4fae6b"/>
  <text x="115" y="53" font-size="14" font-weight="700" fill="#ffffff">⚖️ PJB — Triagem Nacional</text>
  <text x="1195" y="53" text-anchor="end" font-size="12.5" fill="#c9d3ea">NUPN provisório: 0008103-33.2026.8.06.0001</text>

  <!-- veredito principal -->
  <g>
    <rect x="50" y="100" width="360" height="130" rx="14" fill="#16321f"/>
    <text x="76" y="134" font-size="14" fill="#a9b3cc">Veredito</text>
    <text x="76" y="166" font-size="24" font-weight="700" fill="#7fd1a0">APROVADO_COM_RESSALVAS</text>
    <text x="76" y="192" font-size="11.5" fill="#bfe8cc">Confiança geral: 87%</text>
    <text x="76" y="210" font-size="11.5" fill="#bfe8cc">Aprovação automática: sim</text>
  </g>

  <g>
    <rect x="430" y="100" width="380" height="130" rx="14" fill="#171d34"/>
    <text x="456" y="134" font-size="14" fill="#a9b3cc">Classificação sugerida</text>
    <text x="456" y="164" font-size="15" font-weight="700" fill="#ffffff">Procedimento Comum Cível</text>
    <text x="456" y="188" font-size="12" fill="#dfe4ee">Assunto: Indenização por dano moral</text>
    <text x="456" y="208" font-size="11.5" fill="#a9b3cc">Competência sugerida: Vara Cível — comarca do domicílio do réu</text>
  </g>

  <g>
    <rect x="830" y="100" width="360" height="130" rx="14" fill="#171d34"/>
    <text x="856" y="134" font-size="14" fill="#a9b3cc">Análise de prescrição</text>
    <text x="856" y="164" font-size="15" font-weight="700" fill="#7fd1a0">Sem indício de prescrição</text>
    <text x="856" y="188" font-size="11.5" fill="#dfe4ee">Fato gerador há 2 anos e 3 meses</text>
    <text x="856" y="208" font-size="11.5" fill="#a9b3cc">Prazo prescricional aplicável: 3 anos (CC art. 206, §3º, V)</text>
  </g>

  <!-- pendencias -->
  <g>
    <rect x="50" y="250" width="740" height="180" rx="14" fill="#3a3320"/>
    <text x="76" y="282" font-size="14" font-weight="700" fill="#ffffff">⚠️ Pendências detectadas (2)</text>

    <rect x="76" y="300" width="688" height="50" rx="8" fill="#211d10"/>
    <text x="92" y="322" font-size="12.5" fill="#ffffff">Comprovante de residência do autor não confere com o CEP informado</text>
    <text x="92" y="340" font-size="10.5" fill="#e0c98a">Tipo: divergência documental — corrigir antes do protocolo definitivo</text>

    <rect x="76" y="358" width="688" height="50" rx="8" fill="#211d10"/>
    <text x="92" y="380" font-size="12.5" fill="#ffffff">Valor da causa não corresponde à soma dos pedidos líquidos</text>
    <text x="92" y="398" font-size="10.5" fill="#e0c98a">Tipo: inconsistência de valor — recalcular antes do protocolo definitivo</text>
  </g>

  <!-- processos conexos -->
  <g>
    <rect x="810" y="250" width="380" height="180" rx="14" fill="#171d34"/>
    <text x="836" y="282" font-size="14" font-weight="700" fill="#ffffff">🔗 Processos conexos verificados</text>
    <text x="836" y="308" font-size="12" fill="#dfe4ee">Nenhum processo suspeito de</text>
    <text x="836" y="326" font-size="12" fill="#dfe4ee">litispendência ou conexão encontrado</text>
    <text x="836" y="354" font-size="10.5" fill="#a9b3cc">A triagem cruza partes, causa de pedir e</text>
    <text x="836" y="370" font-size="10.5" fill="#a9b3cc">pedido contra a base nacional antes de</text>
    <text x="836" y="386" font-size="10.5" fill="#a9b3cc">liberar o protocolo.</text>
  </g>

  <!-- rodape explicativo -->
  <g>
    <rect x="50" y="450" width="1140" height="120" rx="14" fill="#161c30"/>
    <text x="76" y="480" font-size="13" font-weight="700" fill="#ffffff">Resumo da decisão</text>
    <text x="76" y="506" font-size="12" fill="#dfe4ee">"Petição consistente com o rito de procedimento comum. Aprovada com ressalvas documentais que não impedem o protocolo,</text>
    <text x="76" y="526" font-size="12" fill="#dfe4ee">mas precisam ser corrigidas antes da distribuição definitiva. Nenhum indício de prescrição ou litispendência."</text>
    <text x="76" y="552" font-size="10.5" fill="#5d6785">Dados fictícios, apenas para ilustrar a interface — campos reais de com.tcc.pjb.backend.service.triagem.TriagemNacionalIAEngine.ResultadoTriagem.</text>
  </g>

  <text x="50" y="600" font-size="11.5" fill="#5d6785">Aprovado com ressalvas segue para o motor de rito e distribuição mesmo com pendência aberta — a pendência fica registrada, não bloqueia o fluxo.</text>
</svg>
