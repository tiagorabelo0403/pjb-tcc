<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Painel do Procurador — execução fiscal e malha de processos</title>
  <desc id="desc">Mockup do painel do procurador (municipal, estadual ou federal), com o formulário real de ProcuradoriaExecucaoFiscalRequest (devedorCpfCnpj, valorDivida, descricao, comarca) e a malha de processos vinculados via ProcuradoriaOperacionalController.</desc>
  <defs><filter id="s14" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter></defs>

  <rect x="20" y="20" width="1240" height="600" rx="14" fill="#12172a" stroke="#2a3350" filter="url(#s14)"/>
  <rect x="20" y="20" width="1240" height="56" rx="14" fill="#0d1120"/>
  <rect x="20" y="60" width="1240" height="16" fill="#0d1120"/>
  <circle cx="46" cy="48" r="6" fill="#e05252"/><circle cx="66" cy="48" r="6" fill="#e0b84f"/><circle cx="86" cy="48" r="6" fill="#4fae6b"/>
  <text x="115" y="53" font-size="14" font-weight="700" fill="#ffffff">🏢 PJB — Painel da Procuradoria</text>
  <text x="1195" y="53" text-anchor="end" font-size="12.5" fill="#c9d3ea">Dra. Fernanda Lima · PGM</text>

  <g>
    <rect x="50" y="96" width="560" height="300" rx="14" fill="#171d34"/>
    <text x="76" y="128" font-size="14" font-weight="700" fill="#ffffff">💰 Nova execução fiscal</text>

    <text x="76" y="160" font-size="11" fill="#7d879e">devedorCpfCnpj</text>
    <text x="76" y="180" font-size="13" fill="#ffffff">00.000.000/0001-00</text>

    <text x="76" y="214" font-size="11" fill="#7d879e">valorDivida</text>
    <text x="76" y="234" font-size="13" fill="#ffffff">R$ 48.320,00</text>

    <text x="76" y="268" font-size="11" fill="#7d879e">comarca</text>
    <text x="76" y="288" font-size="13" fill="#ffffff">Fortaleza</text>

    <text x="76" y="322" font-size="11" fill="#7d879e">descricao</text>
    <text x="76" y="342" font-size="12" fill="#dfe4ee">IPTU em atraso, exercícios 2023-2025</text>

    <rect x="76" y="360" width="240" height="20" rx="10" fill="#0f1830"/>
    <text x="196" y="374" text-anchor="middle" font-size="10.5" fill="#5d6785">▶ Ajuizar execução fiscal</text>
  </g>

  <g>
    <rect x="630" y="96" width="560" height="300" rx="14" fill="#161c30"/>
    <text x="656" y="128" font-size="14" font-weight="700" fill="#ffffff">🕸️ Malha de processos vinculados</text>
    <text x="656" y="156" font-size="11.5" fill="#dfe4ee">Execuções fiscais do mesmo devedor,</text>
    <text x="656" y="174" font-size="11.5" fill="#dfe4ee">consolidadas para evitar tese divergente</text>
    <text x="656" y="192" font-size="11.5" fill="#dfe4ee">entre processos parecidos:</text>

    <rect x="656" y="210" width="504" height="42" rx="8" fill="#171d34"/>
    <text x="672" y="236" font-size="11.5" fill="#ffffff">0008201-00.2025.8.06.0001 — mesmo devedor, IPTU 2022</text>

    <rect x="656" y="258" width="504" height="42" rx="8" fill="#171d34"/>
    <text x="672" y="284" font-size="11.5" fill="#ffffff">0008199-88.2024.8.06.0001 — mesmo devedor, ISS 2021</text>

    <text x="656" y="330" font-size="10.5" fill="#5d6785">Ver /processos/{id}/malha (ProcuradoriaOperacionalController).</text>
  </g>

  <text x="50" y="440" font-size="11" fill="#5d6785">A Procuradoria representa a Fazenda Pública (município, estado ou União) — o desafio estratégico aqui é consistência de</text>
  <text x="50" y="460" font-size="11" fill="#5d6785">tese entre milhares de execuções parecidas, diferente da priorização por vulnerabilidade individual da Defensoria.</text>
  <text x="50" y="500" font-size="10.5" fill="#5d6785">Dados fictícios — campos reais de ProcuradoriaExecucaoFiscalRequest.</text>
</svg>
