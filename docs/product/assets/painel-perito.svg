<svg viewBox="0 0 1280 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Painel do Perito — laudos pendentes e atrasados por subtipo de perícia</title>
  <desc id="desc">Mockup do painel do perito, com os campos reais de PeritoPayload (subtipoPericia, laudosPendentes, laudosAtrasados) e envio direto do laudo via LaudoPericialController.</desc>
  <defs><filter id="s6" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter></defs>

  <rect x="20" y="20" width="1240" height="560" rx="14" fill="#12172a" stroke="#2a3350" filter="url(#s6)"/>
  <rect x="20" y="20" width="1240" height="56" rx="14" fill="#0d1120"/>
  <rect x="20" y="60" width="1240" height="16" fill="#0d1120"/>
  <circle cx="46" cy="48" r="6" fill="#e05252"/><circle cx="66" cy="48" r="6" fill="#e0b84f"/><circle cx="86" cy="48" r="6" fill="#4fae6b"/>
  <text x="115" y="53" font-size="14" font-weight="700" fill="#ffffff">🔬 PJB — Painel do Perito</text>
  <text x="1195" y="53" text-anchor="end" font-size="12.5" fill="#c9d3ea">Dra. Helena Prado · subtipoPericia: Médica</text>

  <g font-size="12">
    <rect x="50" y="96" width="300" height="90" rx="12" fill="#2f5d62"/>
    <text x="66" y="122" font-size="10.5" fill="#cfe6e5">subtipoPericia</text>
    <text x="66" y="150" font-size="15" font-weight="700" fill="#ffffff">Médica</text>

    <rect x="366" y="96" width="220" height="90" rx="12" fill="#3a3320"/>
    <text x="382" y="122" font-size="10.5" fill="#e0c98a">laudosPendentes</text>
    <text x="382" y="150" font-size="26" font-weight="700" fill="#f4c542">4</text>

    <rect x="602" y="96" width="220" height="90" rx="12" fill="#3a1f28"/>
    <text x="618" y="122" font-size="10.5" fill="#f4a3a3">laudosAtrasados</text>
    <text x="618" y="150" font-size="26" font-weight="700" fill="#f4a3a3">1</text>

    <rect x="838" y="96" width="352" height="90" rx="12" fill="#171d34"/>
    <text x="854" y="122" font-size="10.5" fill="#a9b3cc">Disponibilidade (PeritoDisponibilidadeController)</text>
    <text x="854" y="146" font-size="13" fill="#ffffff">Disponível esta semana</text>
  </g>

  <g>
    <rect x="50" y="206" width="1140" height="290" rx="14" fill="#161c30"/>
    <text x="76" y="238" font-size="14" font-weight="700" fill="#ffffff">📄 Envio de laudo pericial (LaudoPericialController)</text>

    <text x="76" y="268" font-size="11" fill="#7d879e">Processo</text>
    <text x="76" y="288" font-size="13" fill="#ffffff">0008101-11.2026.8.06.0001</text>

    <text x="76" y="318" font-size="11" fill="#7d879e">Nomeação</text>
    <text x="76" y="338" font-size="13" fill="#ffffff">Aceita em 25/07/2026</text>

    <rect x="620" y="256" width="480" height="90" rx="8" fill="#0f1830"/>
    <text x="636" y="280" font-size="11.5" fill="#dfe4ee">📎 laudo_pericial_medico.pdf</text>
    <text x="636" y="300" font-size="10.5" fill="#a9b3cc">Enviado diretamente ao processo — sem</text>
    <text x="636" y="316" font-size="10.5" fill="#a9b3cc">e-mail nem protocolo físico à parte.</text>

    <rect x="76" y="380" width="240" height="46" rx="10" fill="#2c3e67"/>
    <text x="196" y="408" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">▶ Enviar laudo</text>

    <text x="76" y="460" font-size="10.5" fill="#5d6785">Dados fictícios — campos reais de PeritoPayload, LaudoPericialController e PeritoDisponibilidadeController.</text>
  </g>
</svg>
