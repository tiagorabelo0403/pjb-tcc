<svg viewBox="0 0 1280 740" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Painel da secretaria — fila com próxima ação sugerida e detecção de gargalo</title>
  <desc id="desc">Mockup de interface do painel do servidor de secretaria/cartório, mostrando a fila de trabalho priorizada com a ação concreta sugerida para cada processo (com base em SecretariatQueueNextBestActionService), distinguindo ato cartorário de ato jurisdicional, e o painel de detecção de gargalo.</desc>

  <defs>
    <filter id="sombra10" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1240" height="700" rx="14" fill="#12172a" stroke="#2a3350" stroke-width="1" filter="url(#sombra10)"/>
  <rect x="20" y="20" width="1240" height="56" rx="14" fill="#0d1120"/>
  <rect x="20" y="60" width="1240" height="16" fill="#0d1120"/>
  <circle cx="46" cy="48" r="6" fill="#e05252"/>
  <circle cx="66" cy="48" r="6" fill="#e0b84f"/>
  <circle cx="86" cy="48" r="6" fill="#4fae6b"/>
  <text x="115" y="53" font-size="14" font-weight="700" fill="#ffffff">🏛️ PJB — Painel da Secretaria</text>
  <text x="1195" y="53" text-anchor="end" font-size="12.5" fill="#c9d3ea">Servidor: Ana Paula Costa · 2ª Vara Cível</text>

  <!-- fila com proxima acao -->
  <g>
    <rect x="50" y="96" width="1140" height="330" rx="14" fill="#171d34"/>
    <text x="76" y="128" font-size="14" font-weight="700" fill="#ffffff">📋 Fila — ordenada pela próxima ação sugerida, não por data de entrada</text>

    <text x="76" y="156" font-size="11" fill="#7d879e">Processo</text>
    <text x="330" y="156" font-size="11" fill="#7d879e">Sinal detectado</text>
    <text x="600" y="156" font-size="11" fill="#7d879e">Ação sugerida</text>
    <text x="900" y="156" font-size="11" fill="#7d879e">Natureza do ato</text>
    <line x1="76" y1="166" x2="1150" y2="166" stroke="#2a3350"/>

    <rect x="76" y="176" width="1074" height="46" rx="8" fill="#3a3320"/>
    <text x="92" y="204" font-size="12" fill="#ffffff">0008101-11.2026.8.06.0001</text>
    <text x="330" y="204" font-size="11.5" fill="#e0c98a">DOCUMENTO_SEM_ASSINATURA</text>
    <text x="600" y="204" font-size="11.5" fill="#ffffff">Revisar e assinar documento</text>
    <text x="900" y="204" font-size="10.5" fill="#f4a3a3">⚠ exige confirmação humana</text>

    <rect x="76" y="228" width="1074" height="46" rx="8" fill="#171d34"/>
    <text x="92" y="256" font-size="12" fill="#ffffff">0008102-22.2026.8.06.0001</text>
    <text x="330" y="256" font-size="11.5" fill="#dfe4ee">EXPEDIENTE_PENDENTE</text>
    <text x="600" y="256" font-size="11.5" fill="#ffffff">Verificar AR e registrar ciência</text>
    <text x="900" y="256" font-size="10.5" fill="#7fd1a0">✓ ato cartorário</text>

    <rect x="76" y="280" width="1074" height="46" rx="8" fill="#171d34"/>
    <text x="92" y="308" font-size="12" fill="#ffffff">0008050-05.2026.8.06.0001</text>
    <text x="330" y="308" font-size="11.5" fill="#dfe4ee">DECURSO_NAO_CERTIFICADO</text>
    <text x="600" y="308" font-size="11.5" fill="#ffffff">Certificar decurso de prazo nos autos</text>
    <text x="900" y="308" font-size="10.5" fill="#7fd1a0">✓ ato cartorário</text>

    <rect x="76" y="332" width="1074" height="46" rx="8" fill="#171d34"/>
    <text x="92" y="360" font-size="12" fill="#ffffff">0008030-77.2026.8.06.0001</text>
    <text x="330" y="360" font-size="11.5" fill="#dfe4ee">MANDADO_DEVOLVIDO</text>
    <text x="600" y="360" font-size="11.5" fill="#ffffff">Expedir novo mandado, endereço atualizado</text>
    <text x="900" y="360" font-size="10.5" fill="#7fd1a0">✓ ato cartorário</text>

    <text x="76" y="404" font-size="11" fill="#5d6785">A fila não diz só "veja este processo" — diz a ação concreta e já classifica se é algo que a própria secretaria resolve</text>
    <text x="76" y="420" font-size="11" fill="#5d6785">ou algo que só o juiz pode decidir, para nunca misturar as duas coisas.</text>
  </g>

  <!-- deteccao de gargalo -->
  <g>
    <rect x="50" y="440" width="1140" height="180" rx="14" fill="#161c30"/>
    <text x="76" y="472" font-size="14" font-weight="700" fill="#ffffff">📉 Detecção de gargalo — onde a fila está entupindo</text>

    <text x="76" y="502" font-size="11.5" fill="#dfe4ee">Documentos aguardando assinatura</text>
    <rect x="76" y="512" width="500" height="14" rx="7" fill="#2a3350"/>
    <rect x="76" y="512" width="360" height="14" rx="7" fill="#f4a3a3"/>
    <text x="590" y="523" font-size="11" fill="#ffffff">72% da fila</text>

    <text x="76" y="552" font-size="11.5" fill="#dfe4ee">Expedientes pendentes de ciência</text>
    <rect x="76" y="562" width="500" height="14" rx="7" fill="#2a3350"/>
    <rect x="76" y="562" width="140" height="14" rx="7" fill="#f4c542"/>
    <text x="590" y="573" font-size="11" fill="#ffffff">28% da fila</text>

    <text x="76" y="596" font-size="11" fill="#5d6785">Sinal: o gargalo real hoje não é falta de servidor — é assinatura pendente concentrada em poucos documentos.</text>

    <text x="700" y="502" font-size="12" font-weight="700" fill="#ffffff">Próximo melhor uso do seu tempo:</text>
    <text x="700" y="526" font-size="12" fill="#f4a3a3">Resolver os 4 documentos parados</text>
    <text x="700" y="544" font-size="12" fill="#f4a3a3">para assinatura primeiro.</text>
  </g>

  <text x="50" y="660" font-size="10.5" fill="#5d6785">Dados fictícios, ilustrativos — campos reais de SecretariatQueueNextBestActionService e SecretariatQueueBottleneckService.</text>
</svg>
