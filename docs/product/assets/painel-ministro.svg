<svg viewBox="0 0 1280 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Painel do Ministro — repercussão geral, competência originária e temas de precedente</title>
  <desc id="desc">Mockup do painel do ministro de tribunal superior, com as três ferramentas exclusivas reais: reconhecer e aplicar tema de repercussão geral (MinistroRepercussaoGeralController), competência originária e temas de recurso repetitivo.</desc>
  <defs><filter id="s16" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter></defs>

  <rect x="20" y="20" width="1240" height="660" rx="14" fill="#12172a" stroke="#2a3350" filter="url(#s16)"/>
  <rect x="20" y="20" width="1240" height="56" rx="14" fill="#0d1120"/>
  <rect x="20" y="60" width="1240" height="16" fill="#0d1120"/>
  <circle cx="46" cy="48" r="6" fill="#e05252"/><circle cx="66" cy="48" r="6" fill="#e0b84f"/><circle cx="86" cy="48" r="6" fill="#4fae6b"/>
  <text x="115" y="53" font-size="14" font-weight="700" fill="#ffffff">⚖️ PJB — Painel do Ministro</text>
  <text x="1195" y="53" text-anchor="end" font-size="12.5" fill="#c9d3ea">Min. Beatriz Andrade</text>

  <!-- repercussao geral -->
  <g>
    <rect x="50" y="96" width="1140" height="160" rx="14" fill="#171d34"/>
    <text x="76" y="128" font-size="14" font-weight="700" fill="#ffffff">🏛️ Repercussão Geral — filtro constitucional exclusivo de tribunal superior</text>

    <rect x="76" y="146" width="500" height="86" rx="10" fill="#3a3320"/>
    <text x="92" y="170" font-size="12" font-weight="600" fill="#ffffff">Tema 1289 — limite de correção monetária</text>
    <text x="92" y="190" font-size="10.5" fill="#e0c98a">Status: aguardando reconhecimento</text>
    <text x="92" y="208" font-size="10" fill="#a9b3cc">▶ Reconhecer tema (POST /repercussao-geral/processos/{id}/reconhecer)</text>

    <rect x="606" y="146" width="504" height="86" rx="10" fill="#16321f"/>
    <text x="622" y="170" font-size="12" font-weight="600" fill="#ffffff">Tema 1104 — prazo em execução fiscal</text>
    <text x="622" y="190" font-size="10.5" fill="#bfe8cc">Status: reconhecido, aguardando julgamento</text>
    <text x="622" y="208" font-size="10" fill="#a9b3cc">▶ Aplicar tema (POST /repercussao-geral/{codigo}/aplicar)</text>
  </g>

  <!-- competencia originaria -->
  <g>
    <rect x="50" y="272" width="560" height="180" rx="14" fill="#161c30"/>
    <text x="76" y="304" font-size="14" font-weight="700" fill="#ffffff">🎯 Competência originária</text>
    <text x="76" y="332" font-size="11.5" fill="#dfe4ee">Casos que começam direto no tribunal</text>
    <text x="76" y="350" font-size="11.5" fill="#dfe4ee">superior, sem passar por instância inferior:</text>

    <rect x="76" y="368" width="504" height="60" rx="8" fill="#171d34"/>
    <text x="92" y="392" font-size="11.5" fill="#ffffff">Mandado de segurança contra ato do</text>
    <text x="92" y="410" font-size="11.5" fill="#ffffff">próprio tribunal — sem grau anterior</text>
  </g>

  <!-- temas de precedente -->
  <g>
    <rect x="630" y="272" width="560" height="180" rx="14" fill="#161c30"/>
    <text x="656" y="304" font-size="14" font-weight="700" fill="#ffffff">📚 Temas de precedente / recurso repetitivo</text>
    <text x="656" y="332" font-size="11.5" fill="#dfe4ee">A tese fixada aqui depois vincula</text>
    <text x="656" y="350" font-size="11.5" fill="#dfe4ee">automaticamente todos os processos semelhantes:</text>

    <rect x="656" y="368" width="504" height="60" rx="8" fill="#171d34"/>
    <text x="672" y="392" font-size="11.5" fill="#ffffff">Tema Repetitivo 987 — critério de correção</text>
    <text x="672" y="410" font-size="11.5" fill="#ffffff">de benefício previdenciário</text>
  </g>

  <g>
    <rect x="50" y="474" width="1140" height="130" rx="14" fill="#0f1830"/>
    <text x="76" y="506" font-size="13" font-weight="700" fill="#ffffff">Por que só o ministro tem essas três ferramentas</text>
    <text x="76" y="532" font-size="11.5" fill="#dfe4ee">Juiz e desembargador decidem o caso concreto; o ministro, além disso, decide o que vincula TODOS os casos parecidos</text>
    <text x="76" y="550" font-size="11.5" fill="#dfe4ee">do país — por isso essas três telas não existem em nenhum outro nível de jurisdição do PJB.</text>
    <text x="76" y="576" font-size="10.5" fill="#5d6785">Dados fictícios — campos reais de MinistroRepercussaoGeralController, MinistroCompetenciaOriginariaController e MinistroTemaPrecedenteController.</text>
  </g>
</svg>
