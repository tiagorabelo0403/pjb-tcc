<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Tela de ajuizamento — o advogado envia a petição inicial com anexos tipados</title>
  <desc id="desc">Mockup de interface do formulário de ajuizamento, mostrando os campos reais capturados na entrada (partes, domicílio de autor e réu, endereço do réu desconhecido) e a declaração tipada de anexos via AnexoDeclarado, validada pelo SmartFileSplitter.</desc>

  <defs>
    <filter id="sombra3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1240" height="720" rx="14" fill="#12172a" stroke="#2a3350" stroke-width="1" filter="url(#sombra3)"/>
  <rect x="20" y="20" width="1240" height="56" rx="14" fill="#0d1120"/>
  <rect x="20" y="60" width="1240" height="16" fill="#0d1120"/>
  <circle cx="46" cy="48" r="6" fill="#e05252"/>
  <circle cx="66" cy="48" r="6" fill="#e0b84f"/>
  <circle cx="86" cy="48" r="6" fill="#4fae6b"/>
  <text x="115" y="53" font-size="14" font-weight="700" fill="#ffffff">⚖️ PJB — Novo Ajuizamento</text>
  <text x="1195" y="53" text-anchor="end" font-size="12.5" fill="#c9d3ea">Dr. Carlos Mendes · OAB/CE 12.345</text>

  <!-- partes -->
  <g>
    <rect x="50" y="100" width="560" height="190" rx="14" fill="#171d34"/>
    <text x="76" y="130" font-size="14" font-weight="700" fill="#ffffff">Partes e domicílio</text>

    <text x="76" y="160" font-size="11.5" fill="#7d879e">Autor</text>
    <text x="76" y="178" font-size="13" fill="#ffffff">Maria da Silva · CPF 000.000.000-00</text>
    <text x="76" y="198" font-size="11" fill="#a9b3cc">UF autor: CE · Comarca autor: Fortaleza</text>

    <line x1="76" y1="212" x2="586" y2="212" stroke="#2a3350"/>

    <text x="76" y="234" font-size="11.5" fill="#7d879e">Réu</text>
    <text x="76" y="252" font-size="13" fill="#ffffff">Comércio Exemplo Ltda. · CNPJ 00.000.000/0001-00</text>
    <g>
      <rect x="76" y="262" width="18" height="18" rx="4" fill="#2a3350" stroke="#7d879e"/>
      <text x="102" y="276" font-size="11" fill="#dfe4ee">Endereço do réu desconhecido (enderecoReuDesconhecido)</text>
    </g>
  </g>

  <g>
    <rect x="630" y="100" width="560" height="190" rx="14" fill="#171d34"/>
    <text x="656" y="130" font-size="14" font-weight="700" fill="#ffffff">Dados do pedido</text>
    <text x="656" y="160" font-size="11.5" fill="#7d879e">Classe processual</text>
    <text x="656" y="178" font-size="13" fill="#ffffff">Procedimento Comum Cível</text>
    <text x="656" y="204" font-size="11.5" fill="#7d879e">Valor da causa</text>
    <text x="656" y="222" font-size="13" fill="#ffffff">R$ 22.000,00</text>
    <text x="656" y="248" font-size="11.5" fill="#7d879e">Ramo do direito</text>
    <text x="656" y="266" font-size="13" fill="#ffffff">Cível</text>
  </g>

  <!-- anexos tipados -->
  <g>
    <rect x="50" y="310" width="1140" height="230" rx="14" fill="#161c30"/>
    <text x="76" y="340" font-size="14" font-weight="700" fill="#ffffff">📎 Anexos — cada arquivo com tipo declarado (AnexoDeclarado)</text>

    <g font-size="11.5" fill="#dfe4ee">
      <text x="76" y="368" fill="#7d879e">Arquivo</text>
      <text x="420" y="368" fill="#7d879e">Tipo declarado</text>
      <text x="700" y="368" fill="#7d879e">Categoria</text>
      <text x="920" y="368" fill="#7d879e">Correlação</text>
      <line x1="76" y1="378" x2="1150" y2="378" stroke="#2a3350"/>

      <rect x="76" y="386" width="1074" height="38" rx="6" fill="#16321f"/>
      <text x="92" y="410" fill="#ffffff">peticao_inicial.pdf</text>
      <text x="420" y="410" fill="#ffffff">PECA_INAUGURAL</text>
      <text x="700" y="410" fill="#a9b3cc">Peça inaugural</text>
      <text x="920" y="410" fill="#7fd1a0">✓ Confere</text>

      <rect x="76" y="428" width="1074" height="38" rx="6" fill="#16321f"/>
      <text x="92" y="452" fill="#ffffff">contrato_prestacao_servico.pdf</text>
      <text x="420" y="452" fill="#ffffff">DOC_INSTRUCAO</text>
      <text x="700" y="452" fill="#a9b3cc">Documento de instrução</text>
      <text x="920" y="452" fill="#7fd1a0">✓ Confere</text>

      <rect x="76" y="470" width="1074" height="38" rx="6" fill="#3a1f28"/>
      <text x="92" y="494" fill="#ffffff">comprovante_endereco.pdf</text>
      <text x="420" y="494" fill="#ffffff">— sem tipo declarado —</text>
      <text x="700" y="494" fill="#a9b3cc">—</text>
      <text x="920" y="494" fill="#f4a3a3">✗ Sem declaração correspondente</text>
    </g>
  </g>

  <!-- rodape -->
  <g>
    <rect x="50" y="560" width="1140" height="130" rx="14" fill="#0f1830"/>
    <text x="76" y="590" font-size="12.5" fill="#dfe4ee">O SmartFileSplitter valida nome ↔ declaração nos dois sentidos — o terceiro arquivo acima seria rejeitado com HTTP 400</text>
    <text x="76" y="610" font-size="12.5" fill="#dfe4ee">explícito antes de prosseguir. Declarar o tipo é opcional por padrão; a obrigatoriedade por rito é decisão do gate de completude.</text>
    <text x="76" y="640" font-size="11" fill="#5d6785">Dados fictícios, apenas para ilustrar a interface — campos reais de EstruturarRequest, AnexoDeclarado e SmartFileSplitter.</text>

    <rect x="950" y="595" width="200" height="46" rx="10" fill="#2c3e67"/>
    <text x="1050" y="623" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">▶ Enviar para triagem</text>
  </g>
</svg>
