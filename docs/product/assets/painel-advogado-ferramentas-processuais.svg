<svg viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Ferramentas do processo — cockpit do advogado</title>
  <desc id="desc">Mockup das ferramentas por processo do cockpit do advogado: honorários de sucumbência (HonorariosSucumbenciaCalculatorService), custas (AdvogadoCustaItemResponse), regularidade OAB (OabValidationService), conflito de agenda em audiência, substabelecimento de procuração (LaianeLawyerService), jurisprudência contextual por ramo/rito e produtividade do escritório.</desc>
  <defs><filter id="s12" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter></defs>

  <rect x="20" y="20" width="1240" height="720" rx="14" fill="#12172a" stroke="#2a3350" filter="url(#s12)"/>
  <rect x="20" y="20" width="1240" height="56" rx="14" fill="#0d1120"/>
  <rect x="20" y="60" width="1240" height="16" fill="#0d1120"/>
  <circle cx="46" cy="48" r="6" fill="#e05252"/><circle cx="66" cy="48" r="6" fill="#e0b84f"/><circle cx="86" cy="48" r="6" fill="#4fae6b"/>
  <text x="115" y="53" font-size="14" font-weight="700" fill="#ffffff">⚖️ PJB — Ferramentas do processo 0008101-11.2026.8.06.0001</text>
  <text x="1195" y="53" text-anchor="end" font-size="12.5" fill="#c9d3ea">Dr. Ricardo Alves</text>

  <!-- Honorários -->
  <g>
    <rect x="50" y="96" width="280" height="130" rx="12" fill="#171d34"/>
    <text x="66" y="122" font-size="12" font-weight="700" fill="#ffffff">💰 Honorários de sucumbência</text>
    <text x="66" y="146" font-size="10" fill="#a9b3cc">CPC art. 85, §2º — trabalho complexo</text>
    <text x="66" y="180" font-size="22" font-weight="700" fill="#8fd19e">R$ 20.000,00</text>
    <text x="66" y="200" font-size="10" fill="#5d6785">20% sobre condenação de R$ 100.000,00</text>
  </g>

  <!-- OAB -->
  <g>
    <rect x="346" y="96" width="260" height="130" rx="12" fill="#16321f"/>
    <text x="362" y="122" font-size="12" font-weight="700" fill="#ffffff">🪪 Regularidade OAB</text>
    <text x="362" y="150" font-size="20" font-weight="700" fill="#8fd19e">APTA</text>
    <text x="362" y="172" font-size="10" fill="#cdeccf">reasonCode: OAB_APTA</text>
    <text x="362" y="190" font-size="10" fill="#5d6785">fonte: oab-cna</text>
  </g>

  <!-- Conflito de agenda -->
  <g>
    <rect x="622" y="96" width="280" height="130" rx="12" fill="#171d34"/>
    <text x="638" y="122" font-size="12" font-weight="700" fill="#ffffff">📅 Agenda de audiências</text>
    <text x="638" y="150" font-size="18" font-weight="700" fill="#8fd19e">Sem conflito</text>
    <text x="638" y="172" font-size="10" fill="#a9b3cc">1ª Vara Cível — 10/03/2027 14h</text>
    <text x="638" y="190" font-size="10" fill="#5d6785">checado contra toda a agenda do dia na vara</text>
  </g>

  <!-- Jurisprudência contextual -->
  <g>
    <rect x="918" y="96" width="272" height="130" rx="12" fill="#2c3e67"/>
    <text x="934" y="122" font-size="12" font-weight="700" fill="#ffffff">📚 Jurisprudência contextual</text>
    <text x="934" y="146" font-size="10" fill="#c9d3ea">ramo=TRABALHISTA rito=TRABALHISTA_ORDINARIO</text>
    <text x="934" y="168" font-size="10.5" fill="#dfe4ee">3 precedentes — foco-fase-executiva</text>
    <text x="934" y="188" font-size="10" fill="#5d6785">expansão automática por sinônimo de ramo/rito</text>
  </g>

  <!-- Custas -->
  <g>
    <rect x="50" y="248" width="360" height="200" rx="14" fill="#161c30"/>
    <text x="76" y="280" font-size="14" font-weight="700" fill="#ffffff">🧾 Custas do processo</text>
    <text x="76" y="302" font-size="11" fill="#a9b3cc">2 pendentes · R$ 150,00</text>
    <text x="76" y="320" font-size="11" fill="#a9b3cc">1 paga · R$ 30,00</text>

    <rect x="76" y="336" width="308" height="42" rx="8" fill="#3a3320"/>
    <text x="92" y="360" font-size="11" fill="#e0c98a">CUSTAS_INICIAIS — PENDENTE — R$ 100,00</text>

    <rect x="76" y="384" width="308" height="42" rx="8" fill="#3a3320"/>
    <text x="92" y="408" font-size="11" fill="#e0c98a">PREPARO_RECURSAL — PENDENTE — R$ 50,00</text>
  </g>

  <!-- Substabelecimento -->
  <g>
    <rect x="426" y="248" width="380" height="200" rx="14" fill="#161c30"/>
    <text x="452" y="280" font-size="14" font-weight="700" fill="#ffffff">🔗 Substabelecimento de procuração</text>
    <rect x="452" y="300" width="328" height="60" rx="8" fill="#171d34"/>
    <text x="468" y="322" font-size="11" fill="#ffffff">Dr. Ricardo Alves (origem)</text>
    <text x="468" y="342" font-size="10" fill="#a9b3cc">REVOGADA — sem reserva de poderes</text>
    <text x="616" y="335" font-size="16" fill="#5d6785">→</text>
    <rect x="452" y="372" width="328" height="60" rx="8" fill="#16321f"/>
    <text x="468" y="394" font-size="11" fill="#ffffff">Dra. Beatriz Souza (destino)</text>
    <text x="468" y="414" font-size="10" fill="#cdeccf">ATIVA — substabelecidoDeId vinculado</text>
  </g>

  <!-- Produtividade do escritório -->
  <g>
    <rect x="826" y="248" width="364" height="200" rx="14" fill="#161c30"/>
    <text x="852" y="280" font-size="14" font-weight="700" fill="#ffffff">📈 Produtividade do escritório</text>
    <text x="852" y="306" font-size="11" fill="#a9b3cc">142 processos na carteira</text>
    <text x="852" y="326" font-size="11" fill="#a9b3cc">38 encerrados · 104 ativos</text>
    <text x="852" y="346" font-size="11" fill="#a9b3cc">duração média até última movimentação: 61 dias</text>
    <rect x="852" y="362" width="308" height="14" rx="7" fill="#0d1120"/>
    <rect x="852" y="362" width="82" height="14" rx="7" fill="#4fae6b"/>
    <text x="852" y="392" font-size="10" fill="#5d6785">27% encerrados — distribuído por status e rito</text>
  </g>

  <!-- Painel financeiro consolidado -->
  <g>
    <rect x="50" y="472" width="1140" height="90" rx="14" fill="#171d34"/>
    <text x="76" y="500" font-size="13" font-weight="700" fill="#ffffff">📊 Painel financeiro consolidado do processo</text>
    <text x="76" y="524" font-size="11" fill="#a9b3cc">totalCustasPendentes: R$ 150,00 · totalCustasPagas: R$ 30,00 · quantidadeCustas: 3</text>
    <text x="76" y="544" font-size="10" fill="#5d6785">soma o que é persistido — honorários seguem calculados sob demanda, sem estado fixo</text>
  </g>

  <text x="50" y="700" font-size="10.5" fill="#5d6785">Dados fictícios — campos reais de AdvogadoHonorariosResponse, AdvogadoCustaItemResponse, AdvogadoOabRegularidadeResponse,</text>
  <text x="50" y="716" font-size="10.5" fill="#5d6785">AdvogadoPainelFinanceiroResponse, AdvogadoProdutividadeEscritorioResponse e LaianeLawyerProcuracaoResponse.</text>
</svg>
