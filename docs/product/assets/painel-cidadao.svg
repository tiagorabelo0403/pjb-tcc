    <rect x="76" y="366" width="1074" height="46" rx="8" fill="#171d34"/>
    <text x="92" y="394" font-size="12" fill="#dfe4ee">0008200-45.2026.8.06.0001 — Juizado Especial Cível, sem advogado</text>

    <text x="76" y="450" font-size="11" fill="#5d6785">Peticionar sozinho é permitido nos casos em que a lei dispensa advogado — sem cobrar procuração.</text>
    <text x="76" y="470" font-size="10.5" fill="#5d6785">Dados fictícios — campos reais de CidadaoPerfilDto e GovBrOidcProperties.</text>
