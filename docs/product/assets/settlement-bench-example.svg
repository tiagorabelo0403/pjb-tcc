<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative example of the settlement bench with a BATNA report</title>
  <desc id="desc">Two parties negotiate in a digital room: one proposes, the other counter-proposes, and the system shows a BATNA report with the amount in discussion, each side's estimated cost, likelihood of appeal, and confidence level, before the agreement is drafted and signed.</desc>

  <text x="30" y="36" font-size="18" font-weight="700" fill="#e8b93a">🤝 Settlement Bench — illustrative example (fictional numbers)</text>

  <!-- proposal bubbles -->
  <g>
    <rect x="30" y="60" width="330" height="90" rx="18" fill="#2c3e67"/>
    <text x="50" y="88" font-size="12.5" font-weight="600" fill="#ffffff">Plaintiff's attorney proposes</text>
    <text x="50" y="112" font-size="13" fill="#dfe4ee">R$ 18,000.00 upfront, within 10 days</text>
    <text x="50" y="132" font-size="11" fill="#a9b3cc">Status: PROPOSAL_PENDING</text>

    <text x="600" y="112" text-anchor="middle" font-size="22" fill="#8a8f98">⇄</text>

    <rect x="840" y="60" width="330" height="90" rx="18" fill="#7a2e3d"/>
    <text x="860" y="88" font-size="12.5" font-weight="600" fill="#ffffff">Defendant's attorney counter-proposes</text>
    <text x="860" y="112" font-size="13" fill="#f0d5da">R$ 13,500.00, in 3 installments</text>
    <text x="860" y="132" font-size="11" fill="#f0d5da">Status: COUNTERPROPOSAL_PENDING</text>
  </g>

  <!-- BATNA report -->
  <g>
    <rect x="30" y="175" width="1140" height="290" rx="18" fill="#161c30"/>
    <text x="55" y="208" font-size="15" font-weight="700" fill="#ffffff">📊 BATNA Report — the best alternative to a negotiated agreement</text>

    <g font-size="12.5" fill="#dfe4ee">
      <text x="55" y="244">Main claim amount</text>
      <text x="55" y="264" font-size="15" font-weight="700" fill="#ffffff">R$ 22,000.00</text>

      <text x="255" y="244">Amount currently in discussion</text>
      <text x="255" y="264" font-size="15" font-weight="700" fill="#f4c542">R$ 15,750.00</text>

      <text x="455" y="244">Plaintiff's estimated cost</text>
      <text x="455" y="264" font-size="15" font-weight="700" fill="#ffffff">R$ 4,200.00</text>

      <text x="655" y="244">Defendant's estimated cost</text>
      <text x="655" y="264" font-size="15" font-weight="700" fill="#ffffff">R$ 6,800.00</text>

      <text x="855" y="244">Days to ruling, no appeal</text>
      <text x="855" y="264" font-size="15" font-weight="700" fill="#ffffff">≈ 340 days</text>

      <text x="1055" y="244">Days to ruling, with appeal</text>
      <text x="1055" y="264" font-size="15" font-weight="700" fill="#ffffff">≈ 890 days</text>
    </g>

    <line x1="55" y1="290" x2="1115" y2="290" stroke="#2a3350" stroke-width="1"/>

    <text x="55" y="320" font-size="12.5" fill="#a9b3cc">Likelihood of appeal</text>
    <rect x="55" y="330" width="300" height="14" rx="7" fill="#2a3350"/>
    <rect x="55" y="330" width="192" height="14" rx="7" fill="#f4c542"/>
    <text x="365" y="342" font-size="12" fill="#ffffff">64%</text>

    <text x="420" y="320" font-size="12.5" fill="#a9b3cc">Likelihood of reversal on appeal</text>
    <rect x="420" y="330" width="300" height="14" rx="7" fill="#2a3350"/>
    <rect x="420" y="330" width="102" height="14" rx="7" fill="#7a2e3d"/>
    <text x="730" y="342" font-size="12" fill="#ffffff">34%</text>

    <text x="785" y="320" font-size="12.5" fill="#a9b3cc">Overall confidence in the analysis</text>
    <rect x="785" y="330" width="300" height="14" rx="7" fill="#2a3350"/>
    <rect x="785" y="330" width="246" height="14" rx="7" fill="#2f5d62"/>
    <text x="1095" y="342" font-size="12" fill="#ffffff">82%</text>

    <text x="55" y="378" font-size="12" fill="#7d879e">Narrative summary: "Accepting the R$ 15,750.00 now costs less than the</text>
    <text x="55" y="396" font-size="12" fill="#7d879e">plaintiff's R$ 4,200.00 in litigation risk over up to 340 days — the</text>
    <text x="55" y="414" font-size="12" fill="#7d879e">34% chance of reversal on appeal doesn't justify the wait."</text>

    <text x="55" y="446" font-size="11.5" fill="#5d6785">Every calculation is stored with a context hash — auditable later, not just at the moment of the decision.</text>
  </g>

  <!-- lifecycle -->
  <g font-size="12" fill="#a9b3cc">
    <text x="30" y="500" font-size="13" font-weight="600" fill="#ffffff">Once both parties accept:</text>

    <rect x="30" y="515" width="185" height="46" rx="10" fill="#2c3e67"/>
    <text x="122" y="543" text-anchor="middle" fill="#ffffff">Agreement drafted</text>

    <text x="230" y="543" fill="#8a8f98">→</text>

    <rect x="250" y="515" width="185" height="46" rx="10" fill="#2c3e67"/>
    <text x="342" y="543" text-anchor="middle" fill="#ffffff">Parties sign</text>

    <text x="450" y="543" fill="#8a8f98">→</text>

    <rect x="470" y="515" width="185" height="46" rx="10" fill="#2c3e67"/>
    <text x="562" y="543" text-anchor="middle" fill="#ffffff">Sent to the court</text>

    <text x="670" y="543" fill="#8a8f98">→</text>

    <rect x="690" y="515" width="240" height="46" rx="10" fill="#f4c542"/>
    <text x="810" y="543" text-anchor="middle" fill="#161c30" font-weight="700">Approved (or rejected, with reason)</text>
  </g>

  <text x="30" y="600" font-size="11.5" fill="#5d6785">If the proposal was drafted by Laiane, the agreement is only generated after human review — a code-level rule, not a policy on paper.</text>
</svg>
