<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Painel do Defensor Público — priorização por vulnerabilidade</title>
  <desc id="desc">Mockup do painel do defensor público, com os campos reais de DefensorPublicoPayload (defensoriaNucleo, federal, assistidosAtivos) e a fila priorizada por vulnerabilidade via DefensoriaVulnerabilidadeController.</desc>
  <defs><filter id="s3" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter></defs>

  <rect x="20" y="20" width="1240" height="600" rx="14" fill="#12172a" stroke="#2a3350" filter="url(#s3)"/>
  <rect x="20" y="20" width="1240" height="56" rx="14" fill="#0d1120"/>
  <rect x="20" y="60" width="1240" height="16" fill="#0d1120"/>
  <circle cx="46" cy="48" r="6" fill="#e05252"/><circle cx="66" cy="48" r="6" fill="#e0b84f"/><circle cx="86" cy="48" r="6" fill="#4fae6b"/>
  <text x="115" y="53" font-size="14" font-weight="700" fill="#ffffff">🤝 PJB — Painel da Defensoria Pública</text>
  <text x="1195" y="53" text-anchor="end" font-size="12.5" fill="#c9d3ea">Dra. Camila Rocha · Núcleo Cível — estadual</text>

  <g font-size="12">
    <rect x="50" y="96" width="270" height="90" rx="12" fill="#7a2e3d"/>
    <text x="66" y="122" font-size="10.5" fill="#f0d5da">defensoriaNucleo</text>
    <text x="66" y="150" font-size="15" font-weight="700" fill="#ffffff">Núcleo Cível</text>
    <text x="66" y="168" font-size="10.5" fill="#f0d5da">federal: não</text>

    <rect x="336" y="96" width="270" height="90" rx="12" fill="#3a1f28"/>
    <text x="352" y="122" font-size="10.5" fill="#f0d5da">assistidosAtivos</text>
    <text x="352" y="150" font-size="26" font-weight="700" fill="#f4a3a3">187</text>

    <rect x="622" y="96" width="568" height="90" rx="12" fill="#171d34"/>
    <text x="638" y="122" font-size="10.5" fill="#a9b3cc">Por que a priorização importa</text>
    <text x="638" y="146" font-size="11.5" fill="#dfe4ee">187 casos não cabem numa análise manual diária —</text>
    <text x="638" y="164" font-size="11.5" fill="#dfe4ee">o sistema prioriza por vulnerabilidade real da parte.</text>
  </g>

  <g>
    <rect x="50" y="206" width="1140" height="290" rx="14" fill="#161c30"/>
    <text x="76" y="238" font-size="14" font-weight="700" fill="#ffffff">📊 Fila priorizada por vulnerabilidade (DefensoriaVulnerabilidadePriorizarRequest)</text>

    <rect x="76" y="256" width="1074" height="46" rx="8" fill="#3a1f28"/>
    <text x="92" y="284" font-size="12" fill="#ffffff">Assistida Joana P. — risco de despejo em 5 dias, dependente menor de idade</text>
    <text x="1020" y="284" font-size="11" font-weight="700" fill="#f4a3a3">Crítica</text>

    <rect x="76" y="308" width="1074" height="46" rx="8" fill="#3a3320"/>
    <text x="92" y="336" font-size="12" fill="#ffffff">Assistido Marcos T. — pensão alimentícia em atraso, sem renda formal</text>
    <text x="1020" y="336" font-size="11" font-weight="700" fill="#f4c542">Alta</text>

    <rect x="76" y="360" width="1074" height="46" rx="8" fill="#171d34"/>
    <text x="92" y="388" font-size="12" fill="#dfe4ee">Assistida Renata S. — revisão de benefício previdenciário, sem urgência declarada</text>
    <text x="1020" y="388" font-size="11" fill="#7fd1a0">Normal</text>

    <text x="76" y="440" font-size="10.5" fill="#5d6785">O defensor não escolhe manualmente qual dos 187 casos atacar primeiro — o critério é vulnerabilidade, não ordem de chegada.</text>
    <text x="76" y="462" font-size="10.5" fill="#5d6785">Dados fictícios — campos reais de DefensorPublicoPayload e DefensoriaVulnerabilidadeController.</text>
  </g>
</svg>
