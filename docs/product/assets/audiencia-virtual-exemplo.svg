<svg viewBox="0 0 1280 740" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Sala de audiência virtual — participantes por vídeo com verificação biométrica e transcrição</title>
  <desc id="desc">Mockup de interface da sala de audiência WebRTC do PJB: participantes em vídeo restritos por papel, verificação biométrica de presença, transcrição automática da fala e encerramento com geração de ata.</desc>

  <defs>
    <filter id="sombra8" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1240" height="700" rx="14" fill="#12172a" stroke="#2a3350" stroke-width="1" filter="url(#sombra8)"/>
  <rect x="20" y="20" width="1240" height="56" rx="14" fill="#0d1120"/>
  <rect x="20" y="60" width="1240" height="16" fill="#0d1120"/>
  <circle cx="46" cy="48" r="6" fill="#e05252"/>
  <circle cx="66" cy="48" r="6" fill="#e0b84f"/>
  <circle cx="86" cy="48" r="6" fill="#4fae6b"/>
  <text x="115" y="53" font-size="14" font-weight="700" fill="#ffffff">🎥 PJB — Audiência Virtual</text>
  <text x="1195" y="53" text-anchor="end" font-size="12.5" fill="#c9d3ea">🔴 Gravando · transcrição ativa</text>

  <!-- grid de participantes (video) -->
  <g font-size="12">
    <rect x="50" y="96" width="280" height="180" rx="12" fill="#2c3e67"/>
    <circle cx="190" cy="170" r="34" fill="#0d1120"/>
    <text x="190" y="180" text-anchor="middle" font-size="26" fill="#ffffff">👨‍⚖️</text>
    <text x="190" y="252" text-anchor="middle" fill="#ffffff" font-weight="600">Magistrado</text>
    <text x="190" y="266" text-anchor="middle" font-size="10" fill="#c9d3ea">conduz a sessão</text>
    <rect x="60" y="106" width="8" height="8" rx="4" fill="#7fd1a0"/>
    <text x="74" y="114" font-size="9" fill="#bfe8cc">🪪 biometria verificada</text>

    <rect x="340" y="96" width="280" height="180" rx="12" fill="#b3811a"/>
    <circle cx="480" cy="170" r="34" fill="#0d1120"/>
    <text x="480" y="180" text-anchor="middle" font-size="26" fill="#ffffff">⚖️</text>
    <text x="480" y="252" text-anchor="middle" fill="#ffffff" font-weight="600">Advogado(a) das partes</text>
    <rect x="350" y="106" width="8" height="8" rx="4" fill="#7fd1a0"/>
    <text x="364" y="114" font-size="9" fill="#f8e6c4">🪪 biometria verificada</text>

    <rect x="630" y="96" width="280" height="180" rx="12" fill="#7a2e3d"/>
    <circle cx="770" cy="170" r="34" fill="#0d1120"/>
    <text x="770" y="180" text-anchor="middle" font-size="26" fill="#ffffff">⚖️</text>
    <text x="770" y="252" text-anchor="middle" fill="#ffffff" font-weight="600">Ministério Público</text>
    <text x="770" y="266" text-anchor="middle" font-size="10" fill="#f0d5da">quando oficia no caso</text>
    <rect x="640" y="106" width="8" height="8" rx="4" fill="#7fd1a0"/>
    <text x="654" y="114" font-size="9" fill="#f0d5da">🪪 biometria verificada</text>

    <rect x="920" y="96" width="270" height="180" rx="12" fill="#2f5d62"/>
    <circle cx="1055" cy="170" r="34" fill="#0d1120"/>
    <text x="1055" y="180" text-anchor="middle" font-size="26" fill="#ffffff">🔬</text>
    <text x="1055" y="252" text-anchor="middle" fill="#ffffff" font-weight="600">Perito convocado</text>
    <rect x="930" y="106" width="8" height="8" rx="4" fill="#7fd1a0"/>
    <text x="944" y="114" font-size="9" fill="#cfe6e5">🪪 biometria verificada</text>
  </g>

  <!-- transcricao ao vivo -->
  <g>
    <rect x="50" y="300" width="740" height="240" rx="14" fill="#161c30"/>
    <text x="76" y="332" font-size="13" font-weight="700" fill="#ffffff">📝 Transcrição automática (ao vivo)</text>
    <text x="76" y="362" font-size="11.5" fill="#dfe4ee">[14:02:10] Magistrado: Está aberta a audiência. Presentes as partes e seus procuradores.</text>
    <text x="76" y="386" font-size="11.5" fill="#dfe4ee">[14:02:47] Advogado do autor: Requeiro a oitiva da testemunha arrolada anteriormente.</text>
    <text x="76" y="410" font-size="11.5" fill="#dfe4ee">[14:03:15] Perito: Apresento o laudo técnico anexado ao processo em 12/07/2026.</text>
    <text x="76" y="434" font-size="11.5" fill="#dfe4ee">[14:04:02] Magistrado: Defiro o requerimento. Prossiga-se a instrução.</text>
    <text x="76" y="470" font-size="10.5" fill="#5d6785">A transcrição vira a base da ata gerada ao encerrar a sessão — não é digitada do zero.</text>
    <text x="76" y="500" font-size="10.5" fill="#5d6785">Dados fictícios, apenas para ilustrar a interface — campos reais de AudienciaWebRtcController.</text>
  </g>

  <!-- pauta lateral -->
  <g>
    <rect x="810" y="300" width="380" height="240" rx="14" fill="#0f1830"/>
    <text x="836" y="332" font-size="13" font-weight="700" fill="#ffffff">📅 Pauta de hoje — Vara Cível</text>
    <rect x="836" y="350" width="328" height="46" rx="8" fill="#16321f"/>
    <text x="852" y="370" font-size="11" fill="#ffffff">14:00 — 0008101-11.2026.8.06.0001</text>
    <text x="852" y="386" font-size="10" fill="#bfe8cc">em andamento agora</text>

    <rect x="836" y="404" width="328" height="46" rx="8" fill="#1a2540"/>
    <text x="852" y="424" font-size="11" fill="#ffffff">15:00 — 0008102-22.2026.8.06.0001</text>
    <text x="852" y="440" font-size="10" fill="#a9b3cc">partes já intimadas</text>

    <text x="836" y="480" font-size="10.5" fill="#5d6785">Acesso à sala restrito por papel — cada</text>
    <text x="836" y="496" font-size="10.5" fill="#5d6785">participante precisa estar formalmente</text>
    <text x="836" y="512" font-size="10.5" fill="#5d6785">vinculado ao processo para entrar.</text>
  </g>

  <text x="50" y="580" font-size="11" fill="#5d6785">A sinalização WebRTC (oferta e resposta da conexão) e o encerramento da sessão ficam auditados — não é possível "sair sem deixar rastro".</text>
</svg>
