<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Painel do Delegado — escopo restrito à própria delegacia</title>
  <desc id="desc">Mockup do painel do delegado de polícia, com os campos reais de DelegadoPayload (delegaciaId, delegaciaNome, esfera) e a delegação de diligência a uma unidade de apuração específica.</desc>
  <defs><filter id="s4" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter></defs>

  <rect x="20" y="20" width="1240" height="600" rx="14" fill="#12172a" stroke="#2a3350" filter="url(#s4)"/>
  <rect x="20" y="20" width="1240" height="56" rx="14" fill="#0d1120"/>
  <rect x="20" y="60" width="1240" height="16" fill="#0d1120"/>
  <circle cx="46" cy="48" r="6" fill="#e05252"/><circle cx="66" cy="48" r="6" fill="#e0b84f"/><circle cx="86" cy="48" r="6" fill="#4fae6b"/>
  <text x="115" y="53" font-size="14" font-weight="700" fill="#ffffff">🚓 PJB — Painel do Delegado</text>
  <text x="1195" y="53" text-anchor="end" font-size="12.5" fill="#c9d3ea">Delegado Paulo Nunes · Civil</text>

  <g font-size="12">
    <rect x="50" y="96" width="300" height="90" rx="12" fill="#2f5d62"/>
    <text x="66" y="122" font-size="10.5" fill="#cfe6e5">delegaciaId / delegaciaNome</text>
    <text x="66" y="150" font-size="14" font-weight="700" fill="#ffffff">4ª Delegacia Regional</text>
    <text x="66" y="168" font-size="10.5" fill="#cfe6e5">esfera: Civil</text>

    <rect x="366" y="96" width="824" height="90" rx="12" fill="#171d34"/>
    <text x="382" y="122" font-size="10.5" fill="#a9b3cc">Escopo</text>
    <text x="382" y="146" font-size="12.5" fill="#dfe4ee">O delegado só enxerga inquéritos da própria delegacia — nunca de outra unidade, mesmo procurando.</text>
    <text x="382" y="166" font-size="10.5" fill="#5d6785">Aplicado por PjbObjectScopeGuard, não é convenção de tela.</text>
  </g>

  <g>
    <rect x="50" y="206" width="1140" height="290" rx="14" fill="#161c30"/>
    <text x="76" y="238" font-size="14" font-weight="700" fill="#ffffff">🔎 Delegar diligência (DelegadoDiligenciaRequest)</text>

    <text x="76" y="268" font-size="11" fill="#7d879e">Inquérito</text>
    <text x="76" y="288" font-size="13" fill="#ffffff">IPD 2026/0341 — furto qualificado</text>

    <text x="76" y="318" font-size="11" fill="#7d879e">Unidade de apuração destino</text>
    <text x="76" y="338" font-size="13" fill="#ffffff">Núcleo de Perícia Digital</text>

    <text x="620" y="268" font-size="11" fill="#7d879e">Descrição da diligência</text>
    <text x="620" y="288" font-size="12" fill="#dfe4ee">Extração forense do celular apreendido</text>

    <text x="620" y="318" font-size="11" fill="#7d879e">Prioridade</text>
    <text x="620" y="338" font-size="12" fill="#f4c542">Alta</text>

    <rect x="76" y="370" width="964" height="50" rx="8" fill="#0f1830"/>
    <text x="92" y="392" font-size="11" fill="#a9b3cc">Fundamento operacional: material apreendido pode conter evidência de coautoria — risco de perda de dados voláteis.</text>

    <rect x="76" y="440" width="240" height="46" rx="10" fill="#2c3e67"/>
    <text x="196" y="468" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">▶ Delegar diligência</text>

    <text x="76" y="500" font-size="10.5" fill="#5d6785">Dados fictícios — campos reais de DelegadoPayload e DelegadoDiligenciaRequest.</text>
  </g>
</svg>
