<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative example of using the labor judicial calculator</title>
  <desc id="desc">An attorney enters hire date, termination date, and salary; the system returns a detailed report with each calculated item, its legal basis, and the total, plus a PDF with the calculation trail.</desc>

  <text x="30" y="36" font-size="18" font-weight="700" fill="#e8b93a">💰 Judicial Calculator — illustrative example (fictional numbers)</text>

  <!-- input panel -->
  <g>
    <rect x="30" y="60" width="430" height="520" rx="18" fill="#1b2440"/>
    <text x="55" y="95" font-size="15" font-weight="700" fill="#ffffff">👤 Attorney enters</text>

    <text x="55" y="130" font-size="12.5" fill="#a9b3cc">Plaintiff × Defendant</text>
    <text x="55" y="150" font-size="13" fill="#ffffff">Maria da Silva × Sample Retail Co.</text>

    <text x="55" y="182" font-size="12.5" fill="#a9b3cc">Hire date → Termination date</text>
    <text x="55" y="202" font-size="13" fill="#ffffff">03/2021 → 07/2026 (without cause)</text>

    <text x="55" y="234" font-size="12.5" fill="#a9b3cc">Base salary</text>
    <text x="55" y="254" font-size="13" fill="#ffffff">R$ 2,800.00</text>

    <text x="55" y="286" font-size="12.5" fill="#a9b3cc">50% overtime</text>
    <text x="55" y="306" font-size="13" fill="#ffffff">18 hours in the last month</text>

    <text x="55" y="338" font-size="12.5" fill="#a9b3cc">Night-shift premium</text>
    <text x="55" y="358" font-size="13" fill="#ffffff">Not applicable in this case</text>

    <text x="55" y="390" font-size="12.5" fill="#a9b3cc">Automatic add-on effects</text>
    <text x="55" y="410" font-size="13" fill="#ffffff">On vacation, 13th salary, FGTS — checked</text>

    <text x="55" y="450" font-size="12" fill="#7d879e">Every field has its own legal basis —</text>
    <text x="55" y="468" font-size="12" fill="#7d879e">e.g., overtime follows CLT art. 59, §1</text>

    <rect x="55" y="500" width="360" height="50" rx="10" fill="#2c3e67"/>
    <text x="235" y="530" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">▶ Calculate labor severance</text>
  </g>

  <!-- center arrow -->
  <text x="600" y="330" text-anchor="middle" font-size="34" fill="#8a8f98">→</text>

  <!-- output panel -->
  <g>
    <rect x="650" y="60" width="520" height="520" rx="18" fill="#16213e"/>
    <text x="675" y="95" font-size="15" font-weight="700" fill="#ffffff">📄 PJB returns — line-by-line calculation trail</text>

    <g font-size="12.5" fill="#dfe4ee">
      <text x="675" y="128">Outstanding salary balance (23/30 days)</text>
      <text x="1140" y="128" text-anchor="end">R$ 2,146.67</text>

      <text x="675" y="156">Prorated 13th salary (5/12)</text>
      <text x="1140" y="156" text-anchor="end">R$ 1,166.67</text>

      <text x="675" y="184">Prorated vacation + 1/3 bonus</text>
      <text x="1140" y="184" text-anchor="end">R$ 1,244.44</text>

      <text x="675" y="212">Prorated notice period (Law 12,506/2011)</text>
      <text x="1140" y="212" text-anchor="end">R$ 2,940.00</text>

      <text x="675" y="240">50% overtime + weekly-rest reflex</text>
      <text x="1140" y="240" text-anchor="end">R$ 412.38</text>

      <text x="675" y="268">FGTS on the period (8%)</text>
      <text x="1140" y="268" text-anchor="end">R$ 1,512.00</text>

      <text x="675" y="296">FGTS severance penalty (40%)</text>
      <text x="1140" y="296" text-anchor="end">R$ 604.80</text>
    </g>

    <line x1="675" y1="316" x2="1140" y2="316" stroke="#3a4568" stroke-width="1"/>

    <text x="675" y="348" font-size="16" font-weight="700" fill="#ffffff">Estimated total</text>
    <text x="1140" y="348" text-anchor="end" font-size="16" font-weight="700" fill="#f4c542">R$ 10,026.96</text>

    <rect x="675" y="375" width="465" height="70" rx="10" fill="#0f1830"/>
    <text x="695" y="398" font-size="11.5" fill="#a9b3cc">Every line cites the law behind it — nothing appears</text>
    <text x="695" y="416" font-size="11.5" fill="#a9b3cc">without a basis: CLT arts. 457/459, Law 8,036/1990, Law 4,090/1962,</text>
    <text x="695" y="434" font-size="11.5" fill="#a9b3cc">Federal Constitution art. 7, XVII, among others.</text>

    <rect x="675" y="462" width="220" height="50" rx="10" fill="#7a2e3d"/>
    <text x="785" y="492" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">📑 Download auditable PDF</text>

    <text x="675" y="545" font-size="12" fill="#7d879e">Attorney, party, and judge all check</text>
    <text x="675" y="563" font-size="12" fill="#7d879e">the same math, line by line, no black box.</text>
  </g>
</svg>
