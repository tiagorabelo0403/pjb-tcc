  /api/v1/processos/ajuizar:
    post:
      summary: "ProcessoCommandController::POST /api/v1/processos/ajuizar"
      tags:
        - "processos"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - dados
              properties:
                dados:
                  type: object
                  required:
                    - classe
                    - materia
                    - rito
                    - valorCausa
                  properties:
                    classe:
                      type: string
                    assunto:
                      type: string
                    resumoFatico:
                      type: string
                    objetoProcessual:
                      type: string
                    pedidoPrincipal:
                      type: string
                    pedidos:
                      type: array
                      items:
                        type: string
                    provas:
                      type: array
                      items:
                        type: string
                    parteAutoraNome:
                      type: string
                    parteAutoraCpf:
                      type: string
                    parteReuNome:
                      type: string
                    parteReuCpf:
                      type: string
                    ufAutor:
                      type: string
                    comarcaAutor:
                      type: string
                    foroAutor:
                      type: string
                    cidadeFato:
                      type: string
                    municipioFato:
                      type: string
                    foroPretendido:
                      type: string
                    tipoAcao:
                      type: string
                    varaPretendida:
                      type: string
                    tipoJusticaPretendida:
                      type: string
                    tribunalPretendido:
                      type: string
                    materia:
                      type: string
                    rito:
                      type: string
                    valorCausa:
                      type: number
                    nivelSigilo:
                      type: string
                    juizo100Digital:
                      type: boolean
                anexos:
                  type: array
                  items:
                    type: string
                    format: binary
            encoding:
              dados:
                contentType: application/json
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  numeroProcesso:
                    type: string
                  classe:
                    type: string
                  materia:
                    type: string
                  rito:
                    type: string
      security:
        -
          bearerAuth:

