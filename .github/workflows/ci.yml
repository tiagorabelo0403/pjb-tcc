name: PJB Evidence Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: temurin
  MAVEN_OPTS: '-Xmx1g'

jobs:
  evidence-gate:
    name: Evidence Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Compile
        run: ./mvnw -pl pjb-api -am test-compile -q

      - name: Unit Tests
        run: ./mvnw -pl pjb-api -am test -DfailIfNoTests=false -q

      # Roda aqui, e nao no job de guards, porque so aqui existe relatorio de Surefire no disco — e
      # o checkout e novo, entao o conjunto e exatamente o desta execucao. No job separado o guard
      # se recusaria a conferir a contagem de testes, que e justamente a alegacao que mais envelhece.
      - name: README Numeric Truth
        working-directory: scripts
        run: python3 readme_numeric_truth_guard.py

      - name: ArchUnit Guards
        run: ./mvnw -pl pjb-api -am -Dtest="*ArchitectureTest,*ArchTest,PjbSecurityArchitectureTest" test -q

      - name: OpenAPI Contract Validation
        run: ./mvnw -pl pjb-api -am -Dtest="LaianeMpOpenApiSchemaTest" test -q

      - name: SBOM CycloneDX
        # `-am` tambem aqui: sem ele o reator e so o pjb-api, e o bom.json descreve metade do
        # aplicativo. SBOM incompleto faz o escaneamento seguinte olhar para o lado errado.
        #
        # makeAggregateBom escreve sempre no target do projeto RAIZ do reator (doc oficial do
        # plugin: "creates a CycloneDX aggregate BOM at build root"), nao no target do modulo
        # passado em `-pl`. Foi por isso que o passo seguinte falhava com "no such file or
        # directory" em pjb-api/target/bom.json: o arquivo sempre saiu em target/bom.json, na
        # raiz do repo. O scan-ref abaixo aponta para onde o BOM realmente cai.
        run: ./mvnw -pl pjb-api -am org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -q

      # O dependency-check da OWASP saiu daqui. Corrigido o `-am`, ele COMECA a rodar e trava
      # baixando a base da NVD: "NVD API has 391,581 records" + "An NVD API Key was not provided -
      # the update can take a VERY long time". A execucao de medicao foi cancelada no limite de
      # tempo do job. Sem chave da NVD, aquele caminho nao fecha em CI.
      #
      # As duas metades da solucao ja existiam no projeto e nunca tinham sido ligadas: o SBOM
      # CycloneDX e gerado logo acima, e o Trivy ja bloqueia de verdade no cd.yml. Escanear o
      # proprio SBOM com o Trivy cobre as dependencias Java no tempo da PR, com base de
      # vulnerabilidade propria, sem chave e sem os limites de taxa da NVD.
      #
      # Rodou como medicao (exit-code '0') ate aqui: resultado foi 46 CVE (7 CRITICAL, 39 HIGH).
      # As 7 CRITICAL eram todas Tomcat/Netty presos ao teto da serie 3.5.x do Boot (ja EOL),
      # corrigido acima via tomcat.version/netty.version — o scan real ja confirma 0 CRITICAL.
      # As 18 HIGH restantes (postgresql, spring-ai, jackson, micrometer, httpcore5, spring-data,
      # spring-kafka, spring-framework) ficam de fora do bloqueio por ora — nao sao CRITICAL e
      # bloquear a PR inteira por elas agora e trocar "instrumento que nao age" por "instrumento
      # que reprova por motivo que ainda nao foi triado", o mesmo erro que a medicao evitou.
      #
      # Por isso dois passos: o primeiro so mede e reporta CRITICAL+HIGH (exit-code '0', mantem a
      # visibilidade das 18 HIGH em aberto em todo PR); o segundo bloqueia de verdade, mas so por
      # CRITICAL (exit-code '1'). Achou CRITICAL de novo, a PR para.
      - name: Dependency CVE Scan (SBOM) — relatorio CRITICAL+HIGH
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: target/bom.json
          severity: CRITICAL,HIGH
          format: table
          exit-code: '0'

      - name: Dependency CVE Scan (SBOM) — bloqueio CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: target/bom.json
          severity: CRITICAL
          format: table
          exit-code: '1'

      - name: JaCoCo Coverage Report
        run: ./mvnw -pl pjb-api jacoco:report -q || true

      - name: Upload Evidence Pack
        uses: actions/upload-artifact@v7
        with:
          name: evidence-pack-${{ github.sha }}
          retention-days: 90
          path: |
            pjb-api/target/surefire-reports/
            pjb-api/target/site/jacoco/
            target/bom.json

      - name: Coverage Gate (laiane minimo 70%)
        run: |
          COVERAGE=$(grep -oP 'INSTRUCTION.*?(\d+)%' pjb-api/target/site/jacoco/com.tcc.pjb.backend.modules.laiane/index.html 2>/dev/null | grep -oP '\d+' | head -1 || echo "0")
          echo "Cobertura laiane: ${COVERAGE}%"
          if [ "${COVERAGE}" -lt 70 ]; then
            echo "::warning::Cobertura do módulo laiane abaixo de 70%: ${COVERAGE}%"
          fi

  guards-enforce:
    name: Guards (enforce)
    runs-on: ubuntu-latest
    needs: evidence-gate
    permissions:
      contents: read

    steps:
      # fetch-depth: 0 porque o debt_evidence_guard mede "entrada nova ou alterada" contra a base
      # da branch. Com o clone raso padrao nao existe base, e ele reprova dizendo isso em vez de
      # passar sem verificar nada.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: debt_evidence_guard
        working-directory: scripts
        run: python debt_evidence_guard.py

      # Existia e nao rodava em lugar nenhum — checava so duplicata de versao. Passou a cobrir
      # tambem versao que regride e conteudo de migration ja commitada alterado. As tres sao
      # invisiveis para o resto do CI pela mesma razao: Testcontainers sempre parte de banco vazio,
      # entao aplica tudo em ordem e nada disso aparece. Quebra so onde ja existe dado.
      - name: flyway_migration_version_guard
        working-directory: scripts
        run: python flyway_migration_version_guard.py

      # Coluna que afirma guardar hash precisa caber num SHA-256 (64 hex). 193 declaracoes hoje,
      # nenhuma abaixo disso — entra sem baseline. Nao cobre o caso que a motivou
      # (evidence_chave_custodia nao tem "hash" no nome); esse foi corrigido por migration.
      - name: hash_column_width_guard
        working-directory: scripts
        run: python hash_column_width_guard.py

      # `update` sobre banco real com Flyway ligado esconde migration faltante: as migrations
      # constroem o schema e o Hibernate remenda por cima. Era o caso do perfil dev. Nao reprova
      # local/frontend-dev, que usam H2 em memoria com Flyway desligado — la o Hibernate e a unica
      # coisa que cria o schema, e `update` e correto.
      - name: ddl_auto_discipline_guard
        working-directory: scripts
        run: python ddl_auto_discipline_guard.py

      - name: guard_cwd_independence_guard
        working-directory: scripts
        run: python guard_cwd_independence_guard.py

      - name: python_syntax_warning_guard
        working-directory: scripts
        run: python python_syntax_warning_guard.py

      - name: internal_reference_drift_guard
        working-directory: scripts
        run: python internal_reference_drift_guard.py

      - name: transactional_hotspot_guard
        working-directory: scripts
        run: python transactional_hotspot_guard.py --fail-on-findings --fail-on-missing-budgets

      - name: constructor_injection_guard
        working-directory: scripts
        run: python constructor_injection_guard.py

  guards-report:
    name: Guards (report)
    runs-on: ubuntu-latest
    needs: evidence-gate
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: runtime_concurrency_guard
        working-directory: scripts
        run: python runtime_concurrency_guard.py

      - name: architecture_hygiene_guard
        working-directory: scripts
        run: python architecture_hygiene_guard.py

      - name: test_isolation_guard
        working-directory: scripts
        run: python test_isolation_guard.py

      - name: hibernate_filter_definition_guard
        working-directory: scripts
        run: python hibernate_filter_definition_guard.py

      - name: integration_test_naming_guard
        working-directory: scripts
        run: python integration_test_naming_guard.py

      - name: java_comment_discipline_guard
        working-directory: scripts
        run: python java_comment_discipline_guard.py

      - name: debt_log_hygiene_guard
        working-directory: scripts
        run: python debt_log_hygiene_guard.py

      - name: conditional_property_declared_guard
        working-directory: scripts
        run: |
          python -m pip install --quiet pyyaml
          python conditional_property_declared_guard.py

      - name: java_regression_signature_guard
        working-directory: scripts
        run: python java_regression_signature_guard.py

      - name: internal_type_hygiene_guard
        working-directory: scripts
        run: python internal_type_hygiene_guard.py

      - name: canonical_institutional_route_guard
        working-directory: scripts
        run: python canonical_institutional_route_guard.py

      - name: readme_truthfulness_guard
        working-directory: scripts
        run: python readme_truthfulness_guard.py

      - name: test_drift_guard
        working-directory: scripts
        run: python test_drift_guard.py

      - name: repository_layout_guard
        working-directory: scripts
        run: python repository_layout_guard.py

      - name: repository_cleanliness_guard
        working-directory: scripts
        run: python repository_cleanliness_guard.py

      - name: salario_minimo_hardcoded_guard
        working-directory: scripts
        run: python salario_minimo_hardcoded_guard.py

      - name: tribunal_readiness_guard
        working-directory: scripts
        run: python tribunal_readiness_guard.py

      - name: universal_digital_core_guard
        working-directory: scripts
        run: python universal_digital_core_guard.py

      - name: modular_monolith_guard
        working-directory: scripts
        run: python modular_monolith_guard.py

      - name: judicial_innovation_guard
        working-directory: scripts
        run: python judicial_innovation_guard.py

      - name: judicial_innovation_part_two_guard
        working-directory: scripts
        run: python judicial_innovation_part_two_guard.py

      - name: judicial_innovation_part_three_guard
        working-directory: scripts
        run: python judicial_innovation_part_three_guard.py

      - name: access_key_and_unavailability_guard
        working-directory: scripts
        run: python access_key_and_unavailability_guard.py

      - name: config_taxonomy_guard
        working-directory: scripts
        run: python config_taxonomy_guard.py

      - name: docker_compose_guard
        working-directory: scripts
        run: |
          python -m pip install --quiet pyyaml
          python docker_compose_guard.py

      - name: drain_quiet_period_argline_guard
        working-directory: scripts
        run: python drain_quiet_period_argline_guard.py

      - name: git_secret_guard
        working-directory: scripts
        run: python git_secret_guard.py

      - name: java_string_literal_sanity_guard
        working-directory: scripts
        run: python java_string_literal_sanity_guard.py

      - name: legal_ai_policy_catalog_guard
        working-directory: scripts
        run: python legal_ai_policy_catalog_guard.py

      - name: legal_ai_surface_split_guard
        working-directory: scripts
        run: python legal_ai_surface_split_guard.py

      - name: legal_knowledge_catalog_guard
        working-directory: scripts
        run: python legal_knowledge_catalog_guard.py

      - name: legal_mcp_catalog_guard
        working-directory: scripts
        run: python legal_mcp_catalog_guard.py

      - name: pjb_runtime_memory_recipe_guard
        working-directory: scripts
        run: python pjb_runtime_memory_recipe_guard.py

      - name: powershell_test_collector_guard
        working-directory: scripts
        run: python powershell_test_collector_guard.py

      - name: replacement_matrix_guard
        working-directory: scripts
        run: python replacement_matrix_guard.py

      - name: spring_ambiguous_constructor_guard
        working-directory: scripts
        run: python spring_ambiguous_constructor_guard.py

      - name: spring_surface_guard
        working-directory: scripts
        run: python spring_surface_guard.py

      - name: Upload Guard Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: guard-reports-${{ github.run_id }}
          path: docs/reports/
          retention-days: 30

  docker-verify:
    name: Docker Build Verify
    runs-on: ubuntu-latest
    needs: evidence-gate
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: pjb-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
