name: CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/pjb
  NAMESPACE: pjb

jobs:
  image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=PJB Backend
            org.opencontainers.image.description=Processo Judicial Brasileiro
            org.opencontainers.image.vendor=PJB

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  deploy-dev:
    name: Deploy → dev
    runs-on: ubuntu-latest
    needs: [image, scan]
    if: github.ref == 'refs/heads/main'
    environment:
      name: dev
      url: https://dev.pjb.jus.br
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-kubectl@v5

      - uses: imranismail/setup-kustomize@v3

      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DEV }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Update image
        working-directory: infra/k8s/overlays/dev
        run: |
          kustomize edit set image pjb-backend=${{ env.IMAGE }}:${{ needs.image.outputs.version }}

      - name: Apply
        run: kubectl apply -k infra/k8s/overlays/dev

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/pjb-api -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/pjb-worker -n ${{ env.NAMESPACE }} --timeout=300s

  deploy-prod:
    name: Deploy → prod
    runs-on: ubuntu-latest
    needs: [image, scan]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: prod
      url: https://pjb.jus.br
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-kubectl@v5

      - uses: imranismail/setup-kustomize@v3

      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Update image
        working-directory: infra/k8s/overlays/prod
        run: |
          kustomize edit set image pjb-backend=${{ env.IMAGE }}:${{ needs.image.outputs.version }}

      - name: Apply
        run: kubectl apply -k infra/k8s/overlays/prod

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/pjb-api -n ${{ env.NAMESPACE }} --timeout=600s
          kubectl rollout status deployment/pjb-worker -n ${{ env.NAMESPACE }} --timeout=600s

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: deploy-prod
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
          body: |
            **Image:** `${{ env.IMAGE }}:${{ needs.image.outputs.version }}`
            **Digest:** `${{ needs.image.outputs.digest }}`
