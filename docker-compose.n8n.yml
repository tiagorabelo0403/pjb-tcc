services:
  n8n-postgres:
    profiles: ["n8n"]
    image: postgres:16
    environment:
      POSTGRES_DB: ${PJB_N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${PJB_N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${PJB_N8N_DB_PASS:-n8n}
    ports:
      - "${PJB_N8N_PG_PORT:-5433}:5432"
    volumes:
      - pjb_n8n_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PJB_N8N_DB_USER:-n8n} -d ${PJB_N8N_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  n8n-main:
    profiles: ["n8n"]
    image: docker.n8n.io/n8nio/n8n:${PJB_N8N_IMAGE_TAG:-stable}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${PJB_N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${PJB_N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${PJB_N8N_DB_PASS:-n8n}
      DB_POSTGRESDB_POOL_SIZE: ${PJB_N8N_DB_POOL_SIZE:-10}
      EXECUTIONS_MODE: queue
      N8N_ENCRYPTION_KEY: ${PJB_N8N_ENCRYPTION_KEY:-change-me-n8n-encryption-key}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      N8N_DISABLE_PRODUCTION_MAIN_PROCESS: "true"
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_QUEUE_METRICS: "true"
      N8N_METRICS_INCLUDE_API_ENDPOINTS: "true"
      N8N_METRICS_PREFIX: ${PJB_N8N_METRICS_PREFIX:-n8n_}
      N8N_EDITOR_BASE_URL: ${PJB_N8N_EDITOR_BASE_URL:-http://localhost:5678}
      WEBHOOK_URL: ${PJB_N8N_WEBHOOK_URL:-http://localhost:5679}
      N8N_HOST: ${PJB_N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${PJB_N8N_PROTOCOL:-http}
      N8N_PROXY_HOPS: ${PJB_N8N_PROXY_HOPS:-1}
      N8N_PAYLOAD_SIZE_MAX: ${PJB_N8N_PAYLOAD_SIZE_MAX:-32}
      N8N_FORMDATA_FILE_SIZE_MAX: ${PJB_N8N_FORMDATA_FILE_SIZE_MAX:-256}
      N8N_LOG_LEVEL: ${PJB_N8N_LOG_LEVEL:-info}
      N8N_LOG_OUTPUT: ${PJB_N8N_LOG_OUTPUT:-console}
    depends_on:
      n8n-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PJB_N8N_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz/readiness >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  n8n-webhook:
    profiles: ["n8n"]
    image: docker.n8n.io/n8nio/n8n:${PJB_N8N_IMAGE_TAG:-stable}
    command: webhook
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${PJB_N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${PJB_N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${PJB_N8N_DB_PASS:-n8n}
      DB_POSTGRESDB_POOL_SIZE: ${PJB_N8N_DB_POOL_SIZE:-10}
      EXECUTIONS_MODE: queue
      N8N_ENCRYPTION_KEY: ${PJB_N8N_ENCRYPTION_KEY:-change-me-n8n-encryption-key}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_QUEUE_METRICS: "true"
      WEBHOOK_URL: ${PJB_N8N_WEBHOOK_URL:-http://localhost:5679}
      N8N_HOST: ${PJB_N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${PJB_N8N_PROTOCOL:-http}
      N8N_PROXY_HOPS: ${PJB_N8N_PROXY_HOPS:-1}
      N8N_LOG_LEVEL: ${PJB_N8N_LOG_LEVEL:-info}
      N8N_LOG_OUTPUT: ${PJB_N8N_LOG_OUTPUT:-console}
    depends_on:
      n8n-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PJB_N8N_WEBHOOK_PORT:-5679}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz/readiness >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  n8n-worker:
    profiles: ["n8n"]
    image: docker.n8n.io/n8nio/n8n:${PJB_N8N_IMAGE_TAG:-stable}
    command: worker --concurrency=${PJB_N8N_WORKER_CONCURRENCY:-10}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${PJB_N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${PJB_N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${PJB_N8N_DB_PASS:-n8n}
      DB_POSTGRESDB_POOL_SIZE: ${PJB_N8N_DB_POOL_SIZE:-10}
      EXECUTIONS_MODE: queue
      N8N_ENCRYPTION_KEY: ${PJB_N8N_ENCRYPTION_KEY:-change-me-n8n-encryption-key}
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_QUEUE_METRICS: "true"
      N8N_LOG_LEVEL: ${PJB_N8N_LOG_LEVEL:-info}
      N8N_LOG_OUTPUT: ${PJB_N8N_LOG_OUTPUT:-console}
    depends_on:
      n8n-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz/readiness >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pjb_n8n_pg_data:
