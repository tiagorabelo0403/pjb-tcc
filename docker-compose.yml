name: pjb
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PJB_DB_NAME:-pjb}
      POSTGRES_USER: ${PJB_DB_USER:-pjb}
      POSTGRES_PASSWORD: ${PJB_DB_PASS:-pjb}
    ports:
      - "${PJB_PG_PORT:-5432}:5432"
    volumes:
      - pjb_pg_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/docker/postgres/postgresql-pjb.conf:/etc/postgresql/postgresql-pjb.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql-pjb.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PJB_DB_USER:-pjb} -d ${PJB_DB_NAME:-pjb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "${PJB_KAFKA_PORT:-9092}:9092"
      - "${PJB_KAFKA_HOST_PORT:-19092}:19092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${PJB_ES_JAVA_OPTS:--Xms512m -Xmx512m}
      - xpack.ml.enabled=false
    ports:
      - "${PJB_ES_PORT:-9200}:9200"
    volumes:
      - pjb_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s >/dev/null || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4
    ports:
      - "${PJB_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pjb_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: pjb-backend:local
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PJB_DB_NAME:-pjb}
      SPRING_DATASOURCE_USERNAME: ${PJB_DB_USER:-pjb}
      SPRING_DATASOURCE_PASSWORD: ${PJB_DB_PASS:-pjb}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      PJB_DB_USER: ${PJB_DB_USER:-pjb}
      PJB_DB_PASS: ${PJB_DB_PASS:-pjb}
      PJB_MASTER_KEY_BASE64: ${PJB_MASTER_KEY_BASE64:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      JAVA_OPTS: ${PJB_JAVA_OPTS:--Dfile.encoding=UTF-8 -Djava.security.egd=file:/dev/urandom}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "${PJB_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/livez | grep -q UP || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

volumes:
  pjb_pg_data:
  pjb_es_data:
  pjb_redis_data:
