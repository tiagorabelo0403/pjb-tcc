spring:
  data:
    redis:
      repositories:
        enabled: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=1m
  main:
    allow-bean-definition-overriding: true
  kafka:
    consumer:
      properties:
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
        max.poll.interval.ms: 30000
camunda:
  client:
    enabled: false
zeebe:
  client:
    enabled: false
pjb:
  kafka:
    scale:
      listener-concurrency: 1
  icp:
    enabled: false
  mni:
    enabled: false
  datajud:
    feed:
      enabled: false
  dje:
    enabled: false
  integrations:
    pje:
      mock-enabled: true
  jobs:
    pg-listen:
      enabled: false
    ciencia-ficta:
      enabled: false
  runtime:
    barrier:
      scheduling:
        enabled: false
