logging:
  level:
    org.apache.kafka: ERROR

spring:
  # As ITs rodam contra Postgres real com as 318 migrations aplicadas, mas herdavam `ddl-auto: none`
  # do application.yml — o Hibernate NAO conferia o schema contra as entidades. Divergencia entre
  # @Column e a coluna real so aparecia em docker/prod, que usam `validate`: ou seja, no deploy. O
  # portao de integracao ficava verde por cima de drift.
  #
  # Com `validate`, o mesmo portao que roda as 294 ITs passa a reprovar entidade que nao corresponde
  # ao schema — e e o que torna verificavel a correcao de evidence_chave_custodia desta fatia. Sem
  # isto, alargar a coluna e o @Column juntos seria mudanca que nada confere.
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      repositories:
        enabled: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=1m
  main:
    allow-bean-definition-overriding: true
  kafka:
    consumer:
      properties:
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000
        max.poll.interval.ms: 30000
camunda:
  client:
    enabled: false
zeebe:
  client:
    enabled: false
pjb:
  security:
    crypto:
      # V344: Usuario.cpf/email passam a exigir CryptoVaultService no save/read. Sem chave mestra
      # configurada aqui, TODA IT que salva Usuario (a esmagadora maioria da suíte) quebraria com
      # IllegalStateException. Testes que precisam provar AES-GCM/HMAC real (não o fallback) sobrescrevem
      # pjb.security.master-key + este flag via @TestPropertySource na própria classe.
      allow-plaintext-fallback: true
    capability-ratelimit:
      # Neutraliza o rate limit por configuracao em vez de @MockitoBean nas ITs. Cada conjunto
      # distinto de mocks entra na chave de cache do contexto Spring, entao mockar o limiter
      # fragmentava o cache sem necessidade. Aqui o bean real roda desligado, exercitando o
      # caminho de codigo verdadeiro. Ver D-fragmentacao-de-contexto-spring-nos-its.
      enabled: false
  kafka:
    scale:
      listener-concurrency: 1
  icp:
    enabled: false
  mni:
    enabled: false
  datajud:
    feed:
      enabled: false
  dje:
    enabled: false
    mock-enabled: true
  bnmp:
    mock-enabled: true
  integrations:
    govbr:
      mock-enabled: true
    pje:
      mock-enabled: true
  demo:
    seed-enabled: false
  jobs:
    pg-listen:
      enabled: false
    ciencia-ficta:
      enabled: false
    conclusao-expirada:
      enabled: false
  runtime:
    barrier:
      scheduling:
        enabled: false
    admission:
      # `warmingUp` e uptime do bean de pressao, e a janela padrao e de 20s. Em IT, cada contexto
      # Spring novo reinicia essa contagem, entao a primeira requisicao "cara" de uma classe recem
      # subida leva 429 RUNTIME_WARMING_UP antes de chegar em qualquer regra de negocio — e passa
      # ou falha conforme o boot demore mais ou menos que 20s, o que e sorteio, nao cobertura.
      #
      # Medido no portao de integracao (run 34774950817): as TRES falhas de assercao da suite eram
      # este 429, e nao o que as dividas diziam. O resto do admission control continua ligado aqui;
      # so a protecao de aquecimento sai, e ela ganhou teste unitario proprio em
      # PjbOperationalAdmissionServiceTest, que antes nao existia. Producao segue com o default true.
      reject-during-warmup: false
