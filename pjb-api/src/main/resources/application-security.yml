pjb:
  security:
    master-key: ${PJB_MASTER_KEY_BASE64:}
    hardening:
      enabled: ${PJB_SECURITY_HARDENING_ENABLED:true}
      reject-trace: ${PJB_SECURITY_HARDENING_REJECT_TRACE:true}
      reject-track: ${PJB_SECURITY_HARDENING_REJECT_TRACK:true}
      reject-connect: ${PJB_SECURITY_HARDENING_REJECT_CONNECT:true}
      reject-method-override-headers: ${PJB_SECURITY_HARDENING_REJECT_METHOD_OVERRIDE:true}
      add-browser-hardening-headers: ${PJB_SECURITY_HARDENING_BROWSER_HEADERS:true}
      no-store-sensitive-responses: ${PJB_SECURITY_HARDENING_NOSTORE_SENSITIVE:true}
      sensitive-paths: ${PJB_SECURITY_HARDENING_SENSITIVE_PATHS:["/api/admin/","/api/v1/admin/","/actuator/","/api/v1/security/","/api/v1/auth/"]}
    policy:
      version: ${PJB_SECURITY_POLICY_VERSION:v1}
      descriptor-resource: ${PJB_SECURITY_POLICY_DESCRIPTOR_RESOURCE:classpath:policies/security/pjb-access-policy.json}
    auth:
      certificado:
        nonce-ttl: ${PJB_SECURITY_AUTH_CERTIFICADO_NONCE_TTL:120s}
        enforce-icp-real-em-prod: ${PJB_SECURITY_AUTH_CERTIFICADO_ENFORCE_ICP_REAL_EM_PROD:true}
    perimeter:
      enabled: ${PJB_SECURITY_PERIMETER_ENABLED:true}
      trust-proxy-headers: ${PJB_SECURITY_PERIMETER_TRUST_PROXY_HEADERS:false}
      cors-enabled: ${PJB_SECURITY_PERIMETER_CORS_ENABLED:true}
      cors-allowed-origins: ${PJB_SECURITY_PERIMETER_CORS_ALLOWED_ORIGINS:}
      cors-allowed-methods: ${PJB_SECURITY_PERIMETER_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
      cors-allowed-headers: ${PJB_SECURITY_PERIMETER_CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Request-Id,X-PJB-Justificativa,X-PJB-Origin-Id,X-PJB-Body-Hash,X-PJB-Signature,X-PJB-Signature-Alg,X-PJB-Timestamp}
      cors-exposed-headers: ${PJB_SECURITY_PERIMETER_CORS_EXPOSED_HEADERS:RateLimit-Limit,RateLimit-Remaining,RateLimit-Reset,Retry-After,X-RateLimit-Limit,X-RateLimit-Remaining,X-Request-Id,X-PJB-Origin-Mode,X-PJB-Origin-Subject,X-PJB-Origin-Requirement,X-PJB-Origin-Capability}
      cors-allow-credentials: ${PJB_SECURITY_PERIMETER_CORS_ALLOW_CREDENTIALS:false}
      cors-max-age: ${PJB_SECURITY_PERIMETER_CORS_MAX_AGE:1h}
      bypass-paths: ${PJB_SECURITY_PERIMETER_BYPASS_PATHS:}
      proxy:
        reject-untrusted-forwarded-headers: ${PJB_SECURITY_PERIMETER_PROXY_REJECT_UNTRUSTED_HEADERS:true}
        max-forwarded-for-hops: ${PJB_SECURITY_PERIMETER_PROXY_MAX_FORWARDED_FOR_HOPS:8}
        trusted-cidrs: ${PJB_SECURITY_PERIMETER_PROXY_TRUSTED_CIDRS:}
      blocklist:
        store: ${PJB_SECURITY_BLOCKLIST_STORE:memory}
        key-prefix: ${PJB_SECURITY_BLOCKLIST_KEY_PREFIX:pjb:sec:block:}
      ratelimit:
        enabled: ${PJB_SECURITY_PERIMETER_RATELIMIT_ENABLED:true}
        store: ${PJB_SECURITY_RATELIMIT_STORE:memory}
        key-prefix: ${PJB_SECURITY_RATELIMIT_KEY_PREFIX:pjb:sec:rl:}
        window: ${PJB_SECURITY_RATELIMIT_WINDOW:60s}
        maxRequests: ${PJB_SECURITY_RATELIMIT_MAX_REQUESTS:600}
        violation-window: ${PJB_SECURITY_RATELIMIT_VIOLATION_WINDOW:10m}
        ban-after-violations: ${PJB_SECURITY_RATELIMIT_BAN_AFTER_VIOLATIONS:7}
        ban-ttl: ${PJB_SECURITY_RATELIMIT_BAN_TTL:1h}
        rules:
          - name: admin-api
            paths: ["/api/admin/**", "/api/v1/admin/**"]
            methods: ["GET", "POST", "PUT", "DELETE"]
            window: ${PJB_SECURITY_RATELIMIT_ADMIN_WINDOW:60s}
            maxRequests: ${PJB_SECURITY_RATELIMIT_ADMIN_MAX_REQUESTS:120}
            keyStrategy: ip_user
          - name: admin-ritos-reports
            paths: ["/api/admin/ritos/relatorios/**"]
            methods: ["GET"]
            window: ${PJB_SECURITY_RATELIMIT_ADMIN_REPORTS_WINDOW:60s}
            maxRequests: ${PJB_SECURITY_RATELIMIT_ADMIN_REPORTS_MAX_REQUESTS:60}
            keyStrategy: ip_user
          - name: auth-credential-endpoints
            paths: ["/api/v1/auth/passkey/**", "/api/v1/auth/stepup/**", "/api/v1/auth/certificado/**", "/api/v1/auth/govbr/**"]
            methods: ["GET", "POST"]
            window: ${PJB_SECURITY_RATELIMIT_AUTH_WINDOW:60s}
            maxRequests: ${PJB_SECURITY_RATELIMIT_AUTH_MAX_REQUESTS:20}
            violation-window: ${PJB_SECURITY_RATELIMIT_AUTH_VIOLATION_WINDOW:10m}
            ban-after-violations: ${PJB_SECURITY_RATELIMIT_AUTH_BAN_AFTER_VIOLATIONS:3}
            ban-ttl: ${PJB_SECURITY_RATELIMIT_AUTH_BAN_TTL:2h}
            keyStrategy: ip
      origin-governance:
        enabled: ${PJB_SECURITY_PERIMETER_ORIGIN_GOVERNANCE_ENABLED:false}
        allow-referer-fallback: ${PJB_SECURITY_PERIMETER_ORIGIN_ALLOW_REFERER_FALLBACK:true}
        require-body-hash-on-signed-json-requests: ${PJB_SECURITY_PERIMETER_ORIGIN_REQUIRE_BODY_HASH:true}
        max-timestamp-skew: ${PJB_SECURITY_PERIMETER_ORIGIN_MAX_TIMESTAMP_SKEW:5m}
        exempt-prefixes: ${PJB_SECURITY_PERIMETER_ORIGIN_EXEMPT_PREFIXES:["/actuator/health","/livez","/readyz","/startupz","/internal/runtime/"]}
        governed-prefixes: ${PJB_SECURITY_PERIMETER_ORIGIN_GOVERNED_PREFIXES:["/api/v1/auth/","/api/v1/security/","/api/ai/","/api/v1/ia/","/api/v1/peticionamento/","/api/v1/processual/","/api/v1/processos/","/api/v1/institucional/","/api/v1/advogado/","/api/v1/oab/","/api/marketplace/v1/"]}
        signed-required-prefixes: ${PJB_SECURITY_PERIMETER_ORIGIN_SIGNED_REQUIRED_PREFIXES:}
        trusted-browser-origins: ${PJB_SECURITY_PERIMETER_TRUSTED_BROWSER_ORIGINS:}
        selective-signed-rules:
          - name: legal-ai-structured-surfaces
            paths: ["/api/ai/legal/minuta", "/api/ai/legal/grounding/check"]
          - name: legal-ai-conversation-sensitive-capabilities
            paths: ["/api/ai/legal/conversation"]
            capability-values: ${PJB_SECURITY_PERIMETER_ORIGIN_LEGAL_AI_SIGNED_CAPABILITIES:LEGAL_DRAFT_V2,LEGAL_GROUNDING_CHECK_V3,LEGAL_CAPABILITY_RECOVERY_V1}
            capability-json-pointers: ["/context/requestedCapability", "/context/capability", "/context/legalCapability", "/capability", "/contexto/requestedCapability", "/contexto/capability", "/contexto/legalCapability"]
        trusted-origins:
          - active: ${PJB_SECURITY_PERIMETER_EDGE_APP_ACTIVE:false}
            id: ${PJB_SECURITY_PERIMETER_EDGE_APP_ID:edge-app}
            secret: ${PJB_SECURITY_PERIMETER_EDGE_APP_SECRET:}
            allowed-cidrs: ${PJB_SECURITY_PERIMETER_EDGE_APP_ALLOWED_CIDRS:}
            allowed-path-prefixes: ${PJB_SECURITY_PERIMETER_EDGE_APP_ALLOWED_PATH_PREFIXES:/api/v1/auth/,/api/v1/security/,/api/ai/,/api/v1/ia/,/api/v1/peticionamento/,/api/v1/processual/,/api/v1/processos/,/api/v1/institucional/,/api/v1/advogado/,/api/v1/oab/,/api/marketplace/v1/}
            allowed-methods: ${PJB_SECURITY_PERIMETER_EDGE_APP_ALLOWED_METHODS:POST,PUT,PATCH,DELETE}
            allowed-origins: ${PJB_SECURITY_PERIMETER_EDGE_APP_ALLOWED_ORIGINS:}
    capability-ratelimit:
      enabled: ${PJB_SECURITY_CAPABILITY_RATELIMIT_ENABLED:true}
      store: ${PJB_SECURITY_CAPABILITY_RATELIMIT_STORE:redis}
      key-prefix: ${PJB_SECURITY_CAPABILITY_RATELIMIT_KEY_PREFIX:pjb:caprl}
      window-seconds: ${PJB_SECURITY_CAPABILITY_RATELIMIT_WINDOW_SECONDS:60}
      default-limit-tokens: ${PJB_SECURITY_CAPABILITY_RATELIMIT_DEFAULT_LIMIT_TOKENS:60}
    sandbox:
      enabled: ${PJB_SECURITY_SANDBOX_ENABLED:true}
      strict: ${PJB_SECURITY_SANDBOX_STRICT:true}
      allow-localhost: ${PJB_SECURITY_SANDBOX_ALLOW_LOCALHOST:false}
      allow-private: ${PJB_SECURITY_SANDBOX_ALLOW_PRIVATE:false}
      allow-cidrs: ${PJB_SECURITY_SANDBOX_ALLOW_CIDRS:}
      deny-cidrs: ${PJB_SECURITY_SANDBOX_DENY_CIDRS:0.0.0.0/0}
      file-upload:
        max-files: ${PJB_SECURITY_SANDBOX_UPLOAD_MAX_FILES:8}
        allow-content-types: ${PJB_SECURITY_SANDBOX_UPLOAD_ALLOW_CT:application/pdf,image/png,image/jpeg}
        max-bytes: ${PJB_SECURITY_SANDBOX_UPLOAD_MAX_BYTES:10485760}
        magic-bytes-check: ${PJB_SECURITY_SANDBOX_UPLOAD_MAGIC_BYTES:true}
    financeira:
      capability-catalog:
        deny-unknown: ${PJB_SECURITY_FINANCEIRA_CAPABILITY_CATALOG_DENY_UNKNOWN:true}
        allow-if-missing: ${PJB_SECURITY_FINANCEIRA_CAPABILITY_CATALOG_ALLOW_IF_MISSING:false}
        allow-exact: ${PJB_SECURITY_FINANCEIRA_CAPABILITY_CATALOG_ALLOW_EXACT:}
        allow-prefix: ${PJB_SECURITY_FINANCEIRA_CAPABILITY_CATALOG_ALLOW_PREFIX:}
        allow-contains-any: ${PJB_SECURITY_FINANCEIRA_CAPABILITY_CATALOG_ALLOW_CONTAINS_ANY:}
    juridica:
      capability-catalog:
        deny-unknown: ${PJB_SECURITY_JURIDICA_CAPABILITY_CATALOG_DENY_UNKNOWN:true}
        allow-if-missing: ${PJB_SECURITY_JURIDICA_CAPABILITY_CATALOG_ALLOW_IF_MISSING:false}
        allow-exact: ${PJB_SECURITY_JURIDICA_CAPABILITY_CATALOG_ALLOW_EXACT:}
        allow-prefix: ${PJB_SECURITY_JURIDICA_CAPABILITY_CATALOG_ALLOW_PREFIX:}
        allow-contains-any: ${PJB_SECURITY_JURIDICA_CAPABILITY_CATALOG_ALLOW_CONTAINS_ANY:}

  crypto:
    pqc:
      enabled: ${PJB_CRYPTO_PQC_ENABLED:false}
      signature-algorithm: ${PJB_CRYPTO_PQC_SIGNATURE_ALGORITHM:DILITHIUM}

  hsm:
    enabled: ${PJB_HSM_ENABLED:false}
    mock-enabled: ${PJB_HSM_MOCK_ENABLED:true}
    pkcs11-config-path: ${PJB_HSM_PKCS11_CONFIG_PATH:}
    key-alias: ${PJB_HSM_KEY_ALIAS:aliasGovPJB}
    pin: ${PJB_HSM_PIN:}
    trust-store-path: ${PJB_HSM_TRUST_STORE_PATH:}
    trust-store-password: ${PJB_HSM_TRUST_STORE_PASSWORD:}
    trust-store-type: ${PJB_HSM_TRUST_STORE_TYPE:PKCS12}
    signature-algorithm: ${PJB_HSM_SIGNATURE_ALGORITHM:SHA256withRSA}
    operation-timeout: ${PJB_HSM_OPERATION_TIMEOUT:5s}
    max-concurrent-ops: ${PJB_HSM_MAX_CONCURRENT_OPS:8}
    interceptacao-timeout-ms: ${PJB_HSM_INTERCEPTACAO_TIMEOUT_MS:8000}
    auditar-operacoes: ${PJB_HSM_AUDITAR_OPERACOES:true}

  icp:
    enabled: ${PJB_ICP_ENABLED:false}
    enforce-chain-validation: ${PJB_ICP_ENFORCE_CHAIN:false}
    accepted-ac-siglas: ${PJB_ICP_ACCEPTED_ACS:Certisign,Serpro,Valid,AC-JUS,SERASA,CertiSign}
    ocsp-cache-key-prefix: ${PJB_ICP_OCSP_CACHE_PREFIX:pjb:icp:ocsp:}
    ocsp-cache-ttl-seconds: ${PJB_ICP_OCSP_CACHE_TTL:3600}
    crl-cache-ttl-seconds: ${PJB_ICP_CRL_CACHE_TTL:86400}
    pkcs11-lib-path: ${PJB_ICP_PKCS11_LIB:}
    recursal-key-store-ref: ${PJB_ICP_RECURSAL_KEYSTORE_REF:}
    recursal-key-alias: ${PJB_ICP_RECURSAL_KEY_ALIAS:}
    recursal-profile-candidate: ${PJB_ICP_RECURSAL_PROFILE_CANDIDATE:LTA}
    recursal-require-certificate: ${PJB_ICP_RECURSAL_REQUIRE_CERTIFICATE:false}
