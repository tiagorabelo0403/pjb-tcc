spring:
  config:
    activate:
      on-profile: frontend-dev
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: false
  datasource:
    url: 'jdbc:h2:mem:pjb-frontend-dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON\;CREATE DOMAIN IF NOT EXISTS OID AS CLOB'
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=5m,recordStats

server:
  compression:
    enabled: true
    min-response-size: 2048

pjb:
  security:
    perimeter:
      cors-enabled: true
      cors-allowed-origins:
        - http://localhost:3000
        - http://127.0.0.1:3000
        - http://localhost:5173
        - http://127.0.0.1:5173
      cors-allow-credentials: true
      origin-governance:
        enabled: true
        trusted-browser-origins:
          - http://localhost:3000
          - http://127.0.0.1:3000
          - http://localhost:5173
          - http://127.0.0.1:5173
  kafka:
    enabled: false
  workflow:
    enabled: false
  search:
    enabled: false
  icp:
    enabled: false
  mni:
    enabled: false
  datajud:
    feed:
      enabled: false
  eleitoral:
    tse:
      enabled: false
      dry-run: true
  gov:
    vital-monitor:
      enabled: false
  integrations:
    pje:
      mock-enabled: true
    renajud:
      mock-enabled: true
    infojud:
      mock-enabled: true
    sisbajud:
      mock-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
