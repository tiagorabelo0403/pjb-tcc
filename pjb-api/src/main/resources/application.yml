          methods: ["GET", "POST", "PUT", "PATCH"]
          authorities: ["ROLE_ASSESSOR_JUDICIAL", "ROLE_ASSESSOR_DESEMBARGADOR", "ROLE_ASSESSOR_MINISTRO", "ROLE_SERVIDOR", "ROLE_SERVIDOR_FORUM"]
          max-page-size: ${PJB_API_ROUTE_GOVERNANCE_ASSESSOR_MAX_PAGE_SIZE:150}
          max-request-bytes: ${PJB_API_ROUTE_GOVERNANCE_ASSESSOR_MAX_REQUEST_BYTES:524288}
          max-path-segments: ${PJB_API_ROUTE_GOVERNANCE_ASSESSOR_MAX_PATH_SEGMENTS:20}
          max-offset: ${PJB_API_ROUTE_GOVERNANCE_ASSESSOR_MAX_OFFSET:2000}
