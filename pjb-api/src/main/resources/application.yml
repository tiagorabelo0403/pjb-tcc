          prefixes: ["/api/v1/integrations/n8n", "/api/v1/jobs", "/api/v1/work-items", "/api/v1/secretariat"]
          max-in-flight: ${PJB_API_LOAD_SHEDDING_BULK_MAX_IN_FLIGHT:96}
          acquire-timeout: ${PJB_API_LOAD_SHEDDING_BULK_TIMEOUT:20ms}
          rejection-status: ${PJB_API_LOAD_SHEDDING_BULK_STATUS:503}
          rejection-code: LOAD_SHED_BULK
