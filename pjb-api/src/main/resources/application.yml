          rate-limit-key-strategy: ip_user
          no-store-response: true
        - name: gabinete-juiz
          paths: ["/api/v1/juiz/**", "/api/v1/magistratura/**"]
          methods: ["GET", "POST", "PUT", "PATCH"]
          authorities: ["ROLE_MAGISTRADO", "ROLE_JUIZ", "ROLE_JUIZ_ESTADUAL", "ROLE_JUIZ_FEDERAL", "ROLE_JUIZ_TRABALHISTA", "ROLE_JUIZ_ELEITORAL", "ROLE_JUIZ_MILITAR", "ROLE_DESEMBARGADOR", "ROLE_DESEMBARGADOR_FEDERAL", "ROLE_MINISTRO"]
          max-page-size: ${PJB_API_ROUTE_GOVERNANCE_JUDGE_MAX_PAGE_SIZE:120}
