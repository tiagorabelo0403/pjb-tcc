          max-offset: ${PJB_API_ROUTE_GOVERNANCE_JUDGE_MAX_OFFSET:2000}
          allowed-content-types: ["application/json", "application/merge-patch+json", "application/x-www-form-urlencoded"]
          max-requests-per-window: ${PJB_API_ROUTE_GOVERNANCE_JUDGE_RATE_LIMIT:240}
          rate-window-seconds: ${PJB_API_ROUTE_GOVERNANCE_JUDGE_RATE_WINDOW:60}
          rate-limit-key-strategy: ip_user
          no-store-response: true
        - name: gabinete-assessoria
