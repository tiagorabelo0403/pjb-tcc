camunda:
  client:
    enabled: false

logging:
  level:
    org.springframework.data.elasticsearch: WARN
    org.elasticsearch.client: WARN
    org.elasticsearch: WARN

spring:
  config:
    import:
      - classpath:application-ai.yml
      - classpath:application-security.yml
      - classpath:application-integrations.yml
      - classpath:application-resilience.yml
      - classpath:application-api-governance.yml
      - classpath:application-runtime.yml
  data:
    redis:
      repositories:
        enabled: false
    elasticsearch:
      repositories:
        enabled: false
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    async:
      request-timeout: ${PJB_WEB_ASYNC_TIMEOUT:30s}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pjb}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${PJB_DB_POOL_NAME:pjb-write}
      register-mbeans: ${PJB_DB_REGISTER_MBEANS:true}
      maximum-pool-size: ${PJB_DB_POOL_MAX:24}
      minimum-idle: ${PJB_DB_POOL_MIN:4}
      connection-timeout: ${PJB_DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${PJB_DB_VALIDATION_TIMEOUT_MS:5000}
      max-lifetime: ${PJB_DB_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${PJB_DB_KEEPALIVE_TIME_MS:30000}
      initialization-fail-timeout: ${PJB_DB_INITIALIZATION_FAIL_TIMEOUT_MS:1}
      leak-detection-threshold: ${PJB_DB_LEAK_DETECTION_MS:0}
      data-source-properties:
        ApplicationName: ${PJB_DB_APPLICATION_NAME:pjb-backend-core}
        assumeMinServerVersion: ${PJB_DB_ASSUME_MIN_SERVER_VERSION:17}
        connectTimeout: ${PJB_DB_CONNECT_TIMEOUT_SECONDS:10}
        sslmode: ${PJB_DB_SSL_MODE:prefer}
        sslrootcert: ${PJB_DB_SSL_ROOT_CERT:}
        targetServerType: ${PJB_DB_TARGET_SERVER_TYPE:any}
        socketTimeout: ${PJB_DB_SOCKET_TIMEOUT_SECONDS:120}
        preparedStatementCacheQueries: ${PJB_DB_PREPARED_CACHE_QUERIES:512}
        preparedStatementCacheSizeMiB: ${PJB_DB_PREPARED_CACHE_MIB:16}
        reWriteBatchedInserts: ${PJB_DB_REWRITE_BATCHED_INSERTS:true}
        binaryTransfer: ${PJB_DB_BINARY_TRANSFER:true}
        tcpKeepAlive: ${PJB_DB_TCP_KEEP_ALIVE:true}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: ${PJB_JPA_BATCH_SIZE:64}
          fetch_size: ${PJB_JPA_FETCH_SIZE:100}
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: ${PJB_JPA_DEFAULT_BATCH_FETCH_SIZE:64}
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  cache:
    type: ${PJB_CACHE_TYPE:caffeine}
    caffeine:
      spec: ${PJB_CACHE_CAFFEINE_SPEC:maximumSize=50000,expireAfterWrite=10m,recordStats}
  kafka:
    producer:
      properties:
        enable.idempotence: ${PJB_KAFKA_ENABLE_IDEMPOTENCE:true}
        acks: ${PJB_KAFKA_ACKS:all}
        compression.type: ${PJB_KAFKA_COMPRESSION:lz4}
        linger.ms: ${PJB_KAFKA_LINGER_MS:20}
        batch.size: ${PJB_KAFKA_BATCH_SIZE:131072}
        delivery.timeout.ms: ${PJB_KAFKA_DELIVERY_TIMEOUT_MS:120000}
        request.timeout.ms: ${PJB_KAFKA_REQUEST_TIMEOUT_MS:30000}
        max.in.flight.requests.per.connection: ${PJB_KAFKA_MAX_IN_FLIGHT:5}
        retries: ${PJB_KAFKA_RETRIES:2147483647}
        spring.json.add.type.headers: false
    consumer:
      properties:
        isolation.level: ${PJB_KAFKA_ISOLATION_LEVEL:read_committed}
        fetch.min.bytes: ${PJB_KAFKA_FETCH_MIN_BYTES:1}
        fetch.max.wait.ms: ${PJB_KAFKA_FETCH_MAX_WAIT_MS:500}
      max-poll-records: ${PJB_KAFKA_MAX_POLL_RECORDS:500}
    listener:
      type: single
      ack-mode: batch
      missing-topics-fatal: false

server:
  http2:
    enabled: true
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
  tomcat:
    threads:
      max: ${PJB_SERVER_THREADS_MAX:384}
      min-spare: ${PJB_SERVER_THREADS_MIN_SPARE:24}
    accept-count: ${PJB_SERVER_ACCEPT_COUNT:500}
    max-connections: ${PJB_SERVER_MAX_CONNECTIONS:10000}
    processor-cache: ${PJB_SERVER_PROCESSOR_CACHE:200}

pjb:

  institutional:
    official-source:
      connectors:
        enabled: ${PJB_INSTITUTIONAL_OFFICIAL_SOURCE_CONNECTORS_ENABLED:true}
        refresh-hours: ${PJB_INSTITUTIONAL_OFFICIAL_SOURCE_REFRESH_HOURS:12}
        probe-ttl-minutes: ${PJB_INSTITUTIONAL_OFFICIAL_SOURCE_PROBE_TTL_MINUTES:30}
        probe-timeout-millis: ${PJB_INSTITUTIONAL_OFFICIAL_SOURCE_PROBE_TIMEOUT_MILLIS:5000}
        probe-batch-size: ${PJB_INSTITUTIONAL_OFFICIAL_SOURCE_PROBE_BATCH_SIZE:3}
        sources:
          CNJ_DATAJUD:
            enabled: ${PJB_INSTITUTIONAL_CNJ_DATAJUD_ENABLED:true}
            dry-run: ${PJB_INSTITUTIONAL_CNJ_DATAJUD_DRY_RUN:false}
            base-url: ${PJB_INSTITUTIONAL_CNJ_DATAJUD_BASE_URL:https://api-publica.datajud.cnj.jus.br/api_publica_trf1/_search}
            reference-url: https://www.cnj.jus.br/sistemas/datajud/api-publica/
            api-key: ${PJB_INSTITUTIONAL_CNJ_DATAJUD_API_KEY:}
          SIORG:
            enabled: ${PJB_INSTITUTIONAL_SIORG_ENABLED:true}
            dry-run: ${PJB_INSTITUTIONAL_SIORG_DRY_RUN:false}
            base-url: ${PJB_INSTITUTIONAL_SIORG_BASE_URL:https://estruturaorganizacional.dados.gov.br/doc/orgao-entidade/resumida.json?codigoPoder=1&codigoEsfera=1}
            reference-url: https://www.gov.br/gestao/pt-br/assuntos/gestaoeinovacao/modelos-organizacionais/estruturas-organizacionais/Sistema-informatizado-siorg
          IBGE_OU_TOPOLOGIA_CNJ:
            enabled: ${PJB_INSTITUTIONAL_IBGE_ENABLED:true}
            dry-run: ${PJB_INSTITUTIONAL_IBGE_DRY_RUN:false}
            base-url: ${PJB_INSTITUTIONAL_IBGE_BASE_URL:https://servicodados.ibge.gov.br/api/v1/localidades/municipios/2304400}
            reference-url: https://servicodados.ibge.gov.br/api/docs/localidades
          RECEITA_CNPJ:
            enabled: ${PJB_INSTITUTIONAL_RECEITA_CNPJ_ENABLED:true}
            dry-run: ${PJB_INSTITUTIONAL_RECEITA_CNPJ_DRY_RUN:true}
            reference-url: https://www.gov.br/pt-br/servicos/consultar-cadastro-nacional-de-pessoas-juridicas
  storage:
    upload:
      max-batch-items: ${PJB_STORAGE_UPLOAD_MAX_BATCH_ITEMS:64}
      max-batch-total-bytes: ${PJB_STORAGE_UPLOAD_MAX_BATCH_TOTAL_BYTES:536870912}
      max-document-bytes: ${PJB_STORAGE_UPLOAD_MAX_DOCUMENT_BYTES:26214400}
      max-image-bytes: ${PJB_STORAGE_UPLOAD_MAX_IMAGE_BYTES:12582912}
      max-audio-bytes: ${PJB_STORAGE_UPLOAD_MAX_AUDIO_BYTES:33554432}
      max-video-bytes: ${PJB_STORAGE_UPLOAD_MAX_VIDEO_BYTES:134217728}
      max-inline-image-bytes: ${PJB_STORAGE_UPLOAD_MAX_INLINE_IMAGE_BYTES:10485760}
      max-inline-audio-bytes: ${PJB_STORAGE_UPLOAD_MAX_INLINE_AUDIO_BYTES:25165824}
      max-inline-video-bytes: ${PJB_STORAGE_UPLOAD_MAX_INLINE_VIDEO_BYTES:100663296}
      max-inline-total-bytes: ${PJB_STORAGE_UPLOAD_MAX_INLINE_TOTAL_BYTES:167772160}
      max-inline-blocks: ${PJB_STORAGE_UPLOAD_MAX_INLINE_BLOCKS:16}
      max-post-petition-references: ${PJB_STORAGE_UPLOAD_MAX_POST_PETITION_REFERENCES:160}
      max-audio-duration-ms: ${PJB_STORAGE_UPLOAD_MAX_AUDIO_DURATION_MS:900000}
      max-video-duration-ms: ${PJB_STORAGE_UPLOAD_MAX_VIDEO_DURATION_MS:900000}
      sync-preview-max-bytes: ${PJB_STORAGE_UPLOAD_SYNC_PREVIEW_MAX_BYTES:8388608}
      deep-inspection-threshold-bytes: ${PJB_STORAGE_UPLOAD_DEEP_INSPECTION_THRESHOLD_BYTES:50331648}
  live:
    cluster:
      enabled: ${PJB_LIVE_CLUSTER_ENABLED:false}
      channel-prefix: ${PJB_LIVE_CLUSTER_CHANNEL_PREFIX:pjb:live:}
      node-id: ${PJB_LIVE_CLUSTER_NODE_ID:${HOSTNAME:}}
      key-prefix: ${PJB_LIVE_CLUSTER_KEY_PREFIX:pjb:live:cluster:}
      replay-ttl-seconds: ${PJB_LIVE_CLUSTER_REPLAY_TTL_SECONDS:900}
      subscriber-ttl-seconds: ${PJB_LIVE_CLUSTER_SUBSCRIBER_TTL_SECONDS:120}
      subscriber-refresh-ms: ${PJB_LIVE_CLUSTER_SUBSCRIBER_REFRESH_MS:30000}
  jobs:
    pg-listen:
      enabled: ${PJB_JOBS_PG_LISTEN_ENABLED:true}
  scheduling:
    enabled: ${PJB_SCHEDULING_ENABLED:true}
  kafka:
    enabled: ${PJB_KAFKA_ENABLED:false}
    scale:
      listener-concurrency: ${PJB_KAFKA_LISTENER_CONCURRENCY:3}
      poll-timeout: ${PJB_KAFKA_POLL_TIMEOUT:2s}
      idle-between-polls: ${PJB_KAFKA_IDLE_BETWEEN_POLLS:100ms}
      retry-backoff: ${PJB_KAFKA_RETRY_BACKOFF:1s}
      retry-attempts: ${PJB_KAFKA_RETRY_ATTEMPTS:3}
      observation-enabled: ${PJB_KAFKA_OBSERVATION_ENABLED:true}
  procedural:
    bootstrap:
      enabled: ${PJB_PROCEDURAL_BOOTSTRAP_ENABLED:true}
      fail-fast: ${PJB_PROCEDURAL_BOOTSTRAP_FAIL_FAST:false}
      validate-legacy-boundary: ${PJB_PROCEDURAL_BOOTSTRAP_VALIDATE_LEGACY_BOUNDARY:true}
      strict-connector-registry: ${PJB_PROCEDURAL_BOOTSTRAP_STRICT_CONNECTOR_REGISTRY:false}
      strict-connector-registry-profiles: ${PJB_PROCEDURAL_BOOTSTRAP_STRICT_CONNECTOR_REGISTRY_PROFILES:prod,strict}
      max-violations: ${PJB_PROCEDURAL_BOOTSTRAP_MAX_VIOLATIONS:50}
      fail-fast-profiles: ${PJB_PROCEDURAL_BOOTSTRAP_FAIL_FAST_PROFILES:prod}
      source-roots: ${PJB_PROCEDURAL_BOOTSTRAP_SOURCE_ROOTS:src/main/java}

  ritos:
    governance:
      dual-approval-min-occurrences: ${PJB_RITOS_GOV_DUAL_MIN_OCC:10}
      critical-ramos: ${PJB_RITOS_GOV_CRITICAL_RAMOS:["PENAL","ELEITORAL","MILITAR","INFANCIA"]}

  portal:
    base-url: ${PJB_PORTAL_BASE_URL:https://portal.pjb.jus.br}

  comunicacao:
    judicial:
      sefaz-nfe:
        enabled: ${PJB_COMJUD_SEFAZ_NFE_ENABLED:false}
        strict-mode: ${PJB_COMJUD_SEFAZ_NFE_STRICT_MODE:false}
        cache-enabled: ${PJB_COMJUD_SEFAZ_NFE_CACHE_ENABLED:true}
        timeout: ${PJB_COMJUD_SEFAZ_NFE_TIMEOUT:4s}
        user-agent: ${PJB_COMJUD_SEFAZ_NFE_USER_AGENT:PJB-Interceptacao-SefazNFe/1.0}
        consulta-url-por-uf: {}

  secretariat:
    sse:
      bufferSize: ${PJB_SECRETARIAT_SSE_BUFFER_SIZE:400}
      subscriberQueue: ${PJB_SECRETARIAT_SSE_SUBSCRIBER_QUEUE:256}
      dropThreshold: ${PJB_SECRETARIAT_SSE_DROP_THRESHOLD:32}
      replayBuffer: ${PJB_SECRETARIAT_SSE_REPLAY:300}
      maxBatchEvents: ${PJB_SECRETARIAT_SSE_MAX_BATCH:200}
      maxPendingCoalescedKeys: ${PJB_SECRETARIAT_SSE_MAX_PENDING_COALESCED_KEYS:2000}
      flushMs: ${PJB_SECRETARIAT_SSE_FLUSH_MS:200}
      heartbeatMs: ${PJB_SECRETARIAT_SSE_HEARTBEAT_MS:15000}
      emitterTimeoutMs: ${PJB_SECRETARIAT_SSE_EMITTER_TIMEOUT_MS:1800000}
      maxChannels: ${PJB_SECRETARIAT_SSE_MAX_CHANNELS:4096}
      maxSubscribersPerTopic: ${PJB_SECRETARIAT_SSE_MAX_SUBS:8}
      maxChannelsPerFlushCycle: ${PJB_SECRETARIAT_SSE_MAX_CHANNELS_PER_FLUSH:256}
      maxChannelsPerRefreshCycle: ${PJB_SECRETARIAT_SSE_MAX_CHANNELS_PER_REFRESH:512}
      idleChannelTtl: ${PJB_SECRETARIAT_SSE_IDLE_CHANNEL_TTL:5m}
      createChannelOnPublish: ${PJB_SECRETARIAT_SSE_CREATE_ON_PUBLISH:false}

  ui:
    history:
      sse:
        replayBuffer: ${PJB_UI_HISTORY_SSE_REPLAY:300}
        maxBatchEvents: ${PJB_UI_HISTORY_SSE_MAX_BATCH:200}
        maxPendingBacklog: ${PJB_UI_HISTORY_SSE_MAX_PENDING:2000}
        flushMs: ${PJB_UI_HISTORY_SSE_FLUSH_MS:250}
        emitterTimeoutMs: ${PJB_UI_HISTORY_SSE_EMITTER_TIMEOUT_MS:1800000}
        maxChannels: ${PJB_UI_HISTORY_SSE_MAX_CHANNELS:4096}
        maxSubscribersPerTopic: ${PJB_UI_HISTORY_SSE_MAX_SUBS:8}
        maxChannelsPerFlushCycle: ${PJB_UI_HISTORY_SSE_MAX_CHANNELS_PER_FLUSH:256}
        maxChannelsPerRefreshCycle: ${PJB_UI_HISTORY_SSE_MAX_CHANNELS_PER_REFRESH:512}
        idleChannelTtl: ${PJB_UI_HISTORY_SSE_IDLE_CHANNEL_TTL:5m}

    historySse:
      bufferSize: ${PJB_UI_HISTORY_SSE_BUFFER_SIZE:250}
      subscriberQueue: ${PJB_UI_HISTORY_SSE_SUBSCRIBER_QUEUE:256}
      dropThreshold: ${PJB_UI_HISTORY_SSE_DROP_THRESHOLD:32}
      heartbeatMs: ${PJB_UI_HISTORY_SSE_HEARTBEAT_MS:15000}
      createChannelOnPublish: ${PJB_UI_HISTORY_SSE_CREATE_ON_PUBLISH:false}

    accessibility:
      enabled: ${PJB_UI_ACCESSIBILITY_ENABLED:true}
      useOrchestrator: ${PJB_UI_ACCESSIBILITY_USE_ORCHESTRATOR:true}
      minScoreToSuggest: ${PJB_UI_ACCESSIBILITY_MIN_SCORE:320}
      snoozeDuration: ${PJB_UI_ACCESSIBILITY_SNOOZE:90d}
      reevaluateMinInterval: ${PJB_UI_ACCESSIBILITY_REEVALUATE:1d}
      maxReasons: ${PJB_UI_ACCESSIBILITY_MAX_REASONS:6}
      snapshotRetentionDays: ${PJB_UI_ACCESSIBILITY_SNAPSHOT_RETENTION_DAYS:180}
      sse:
        replayBuffer: ${PJB_UI_ACCESSIBILITY_SSE_REPLAY:200}
        maxBatchEvents: ${PJB_UI_ACCESSIBILITY_SSE_MAX_BATCH:200}
        maxPendingBacklog: ${PJB_UI_ACCESSIBILITY_SSE_MAX_PENDING:2000}
        flushMs: ${PJB_UI_ACCESSIBILITY_SSE_FLUSH_MS:250}
        emitterTimeoutMs: ${PJB_UI_ACCESSIBILITY_SSE_EMITTER_TIMEOUT_MS:1800000}
        maxChannels: ${PJB_UI_ACCESSIBILITY_SSE_MAX_CHANNELS:4096}
        maxSubscribersPerTopic: ${PJB_UI_ACCESSIBILITY_SSE_MAX_SUBS:8}
        maxChannelsPerFlushCycle: ${PJB_UI_ACCESSIBILITY_SSE_MAX_CHANNELS_PER_FLUSH:256}
        maxChannelsPerRefreshCycle: ${PJB_UI_ACCESSIBILITY_SSE_MAX_CHANNELS_PER_REFRESH:512}
        idleChannelTtl: ${PJB_UI_ACCESSIBILITY_SSE_IDLE_CHANNEL_TTL:5m}

    accessibilitySse:
      heartbeatMs: ${PJB_UI_ACCESSIBILITY_SSE_HEARTBEAT_MS:15000}

    presentation:
      sse:
        replayBuffer: ${PJB_UI_PRESENTATION_SSE_REPLAY:200}
        maxBatchEvents: ${PJB_UI_PRESENTATION_SSE_MAX_BATCH:200}
        maxPendingBacklog: ${PJB_UI_PRESENTATION_SSE_MAX_PENDING:2000}
        flushMs: ${PJB_UI_PRESENTATION_SSE_FLUSH_MS:250}
        emitterTimeoutMs: ${PJB_UI_PRESENTATION_SSE_EMITTER_TIMEOUT_MS:1800000}
        maxChannels: ${PJB_UI_PRESENTATION_SSE_MAX_CHANNELS:4096}
        maxSubscribersPerTopic: ${PJB_UI_PRESENTATION_SSE_MAX_SUBS:8}
        maxChannelsPerFlushCycle: ${PJB_UI_PRESENTATION_SSE_MAX_CHANNELS_PER_FLUSH:256}
        maxChannelsPerRefreshCycle: ${PJB_UI_PRESENTATION_SSE_MAX_CHANNELS_PER_REFRESH:512}
        idleChannelTtl: ${PJB_UI_PRESENTATION_SSE_IDLE_CHANNEL_TTL:5m}

    presentationSse:
      heartbeatMs: ${PJB_UI_PRESENTATION_SSE_HEARTBEAT_MS:15000}

    readingmode:
      enabledByDefault: ${PJB_UI_READING_ENABLED_BY_DEFAULT:true}
      defaultIntensity: ${PJB_UI_READING_DEFAULT_INTENSITY:SOFT}
      applyToAllPages: ${PJB_UI_READING_APPLY_ALL:true}
      soft:
        maxWidthCh: ${PJB_UI_READING_SOFT_MAX_WIDTH_CH:74}
        lineHeight: ${PJB_UI_READING_SOFT_LINE_HEIGHT:1.65}
        paragraphGapRem: ${PJB_UI_READING_SOFT_PARAGRAPH_GAP_REM:0.75}
        fontScalePercent: ${PJB_UI_READING_SOFT_FONT_SCALE_PERCENT:100}
        letterSpacingEm: ${PJB_UI_READING_SOFT_LETTER_SPACING_EM:0.0}
      medium:

        maxWidthCh: ${PJB_UI_READING_MEDIUM_MAX_WIDTH_CH:70}
        lineHeight: ${PJB_UI_READING_MEDIUM_LINE_HEIGHT:1.72}
        paragraphGapRem: ${PJB_UI_READING_MEDIUM_PARAGRAPH_GAP_REM:0.9}
        fontScalePercent: ${PJB_UI_READING_MEDIUM_FONT_SCALE_PERCENT:105}
        letterSpacingEm: ${PJB_UI_READING_MEDIUM_LETTER_SPACING_EM:0.002}
      strong:
        maxWidthCh: ${PJB_UI_READING_STRONG_MAX_WIDTH_CH:66}
        lineHeight: ${PJB_UI_READING_STRONG_LINE_HEIGHT:1.8}
        paragraphGapRem: ${PJB_UI_READING_STRONG_PARAGRAPH_GAP_REM:1.05}
        fontScalePercent: ${PJB_UI_READING_STRONG_FONT_SCALE_PERCENT:110}
        letterSpacingEm: ${PJB_UI_READING_STRONG_LETTER_SPACING_EM:0.004}

    branding:
      enabled: ${PJB_UI_BRANDING_ENABLED:true}
      object-storage-only: ${PJB_UI_BRANDING_OBJECT_STORAGE_ONLY:true}
      database-blob-forbidden: ${PJB_UI_BRANDING_DATABASE_BLOB_FORBIDDEN:true}
      allow-svg: ${PJB_UI_BRANDING_ALLOW_SVG:false}
      allow-animated: ${PJB_UI_BRANDING_ALLOW_ANIMATED:false}
      storage-prefix: ${PJB_UI_BRANDING_STORAGE_PREFIX:ui/institutional-branding}
      delivery-base-path: ${PJB_UI_BRANDING_DELIVERY_BASE_PATH:/api/v1/ui/branding/assets}
      cache-ttl-seconds: ${PJB_UI_BRANDING_CACHE_TTL_SECONDS:86400}
      allowed-mime-types: ["image/png", "image/jpeg", "image/webp"]
      banner:
        max-bytes: ${PJB_UI_BRANDING_BANNER_MAX_BYTES:2097152}
        max-width-px: ${PJB_UI_BRANDING_BANNER_MAX_WIDTH_PX:1920}
        max-height-px: ${PJB_UI_BRANDING_BANNER_MAX_HEIGHT_PX:320}
      logo:
        max-bytes: ${PJB_UI_BRANDING_LOGO_MAX_BYTES:786432}
        max-width-px: ${PJB_UI_BRANDING_LOGO_MAX_WIDTH_PX:512}
        max-height-px: ${PJB_UI_BRANDING_LOGO_MAX_HEIGHT_PX:512}
      seal:
        max-bytes: ${PJB_UI_BRANDING_SEAL_MAX_BYTES:786432}
        max-width-px: ${PJB_UI_BRANDING_SEAL_MAX_WIDTH_PX:512}
        max-height-px: ${PJB_UI_BRANDING_SEAL_MAX_HEIGHT_PX:512}
      theme:
        max-palette-entries: ${PJB_UI_BRANDING_MAX_PALETTE_ENTRIES:3}
        national-accent: ${PJB_UI_BRANDING_NATIONAL_ACCENT:#0B3A75}
        neutral-surface: ${PJB_UI_BRANDING_NEUTRAL_SURFACE:#F7F9FC}
        neutral-ink: ${PJB_UI_BRANDING_NEUTRAL_INK:#132238}
        watermark-enabled: ${PJB_UI_BRANDING_WATERMARK_ENABLED:true}
        panel-banner-enabled: ${PJB_UI_BRANDING_PANEL_BANNER_ENABLED:true}
        piece-header-banner-enabled: ${PJB_UI_BRANDING_PIECE_HEADER_BANNER_ENABLED:true}
        print-header-enabled: ${PJB_UI_BRANDING_PRINT_HEADER_ENABLED:true}

  atendimento:
    tos:
      version: ${PJB_ATENDIMENTO_TOS_VERSION:1}
      url: ${PJB_ATENDIMENTO_TOS_URL:https://pjb.local/termos/atendimento}
    sse:
      replayBuffer: ${PJB_ATENDIMENTO_SSE_REPLAY:200}
      maxBatchEvents: ${PJB_ATENDIMENTO_SSE_MAX_BATCH:200}
      maxPendingBacklog: ${PJB_ATENDIMENTO_SSE_MAX_PENDING:2000}
      maxSubscribersPerTopic: ${PJB_ATENDIMENTO_SSE_MAX_SUBS:5}
      flushMs: ${PJB_ATENDIMENTO_SSE_FLUSH_MS:200}
      heartbeatMs: ${PJB_ATENDIMENTO_SSE_HEARTBEAT_MS:15000}
      emitterTimeoutMs: ${PJB_ATENDIMENTO_SSE_EMITTER_TIMEOUT_MS:1800000}
      maxChannels: ${PJB_ATENDIMENTO_SSE_MAX_CHANNELS:2048}
      maxChannelsPerFlushCycle: ${PJB_ATENDIMENTO_SSE_MAX_CHANNELS_PER_FLUSH:256}
      idleChannelTtl: ${PJB_ATENDIMENTO_SSE_IDLE_CHANNEL_TTL:5m}

  julgamento:
    votos:
      sse:
        replayBuffer: ${PJB_JULGAMENTO_VOTOS_SSE_REPLAY:300}
        maxBatchEvents: ${PJB_JULGAMENTO_VOTOS_SSE_MAX_BATCH:200}
        maxPendingBacklog: ${PJB_JULGAMENTO_VOTOS_SSE_MAX_PENDING:2000}
        flushMs: ${PJB_JULGAMENTO_VOTOS_SSE_FLUSH_MS:200}
        heartbeatMs: ${PJB_JULGAMENTO_VOTOS_SSE_HEARTBEAT_MS:15000}
        emitterTimeoutMs: ${PJB_JULGAMENTO_VOTOS_SSE_EMITTER_TIMEOUT_MS:1800000}
        maxChannels: ${PJB_JULGAMENTO_VOTOS_SSE_MAX_CHANNELS:4096}
        maxSubscribersPerTopic: ${PJB_JULGAMENTO_VOTOS_SSE_MAX_SUBS:16}
        maxChannelsPerFlushCycle: ${PJB_JULGAMENTO_VOTOS_SSE_MAX_CHANNELS_PER_FLUSH:256}
        maxChannelsPerRefreshCycle: ${PJB_JULGAMENTO_VOTOS_SSE_MAX_CHANNELS_PER_REFRESH:512}
        idleChannelTtl: ${PJB_JULGAMENTO_VOTOS_SSE_IDLE_CHANNEL_TTL:5m}

  cluster:
    coordination:
      enabled: ${PJB_CLUSTER_COORD_ENABLED:true}
      scheduler-singleton-enabled: ${PJB_CLUSTER_SCHEDULER_SINGLETON_ENABLED:true}
      key-prefix: ${PJB_CLUSTER_COORD_KEY_PREFIX:pjb:coord:}
      default-lock-ttl: ${PJB_CLUSTER_COORD_DEFAULT_LOCK_TTL:30s}

  datasource:
    routing:
      enabled: ${PJB_DB_READ_ROUTING_ENABLED:false}
      strict: ${PJB_DB_READ_ROUTING_STRICT:true}
      verify-topology-on-startup: ${PJB_DB_READ_VERIFY_TOPOLOGY_ON_STARTUP:true}
      read-your-writes-window: ${PJB_DB_READ_YOUR_WRITES_WINDOW:5s}
      propagation:
        enabled: ${PJB_DB_READ_PROPAGATION_ENABLED:true}
        request-header-name: ${PJB_DB_READ_PROPAGATION_REQUEST_HEADER:X-PJB-Prefer-Primary-Until}
        response-header-name: ${PJB_DB_READ_PROPAGATION_RESPONSE_HEADER:X-PJB-Primary-Read-Until}
        cookie-name: ${PJB_DB_READ_PROPAGATION_COOKIE_NAME:PJB_RWY_PRIMARY_UNTIL}
        cookie-path: ${PJB_DB_READ_PROPAGATION_COOKIE_PATH:/}
        secure-cookie: ${PJB_DB_READ_PROPAGATION_SECURE_COOKIE:true}
        http-only-cookie: ${PJB_DB_READ_PROPAGATION_HTTP_ONLY_COOKIE:true}
        same-site: ${PJB_DB_READ_PROPAGATION_SAME_SITE:Lax}
        cookie-clock-skew: ${PJB_DB_READ_PROPAGATION_COOKIE_CLOCK_SKEW:5s}
      replica:
        url: ${PJB_DB_READ_URL:}
        username: ${PJB_DB_READ_USER:}
        password: ${PJB_DB_READ_PASS:}
        driver-class-name: ${PJB_DB_READ_DRIVER:}
        fallback-to-write-on-error: ${PJB_DB_READ_FALLBACK_TO_WRITE_ON_ERROR:true}
        failure-cooldown: ${PJB_DB_READ_FAILURE_COOLDOWN:30s}
        hikari:
          maximum-pool-size: ${PJB_DB_READ_POOL_MAX:16}
          minimum-idle: ${PJB_DB_READ_POOL_MIN:2}
          connection-timeout: ${PJB_DB_READ_CONNECTION_TIMEOUT_MS:30000}
          validation-timeout: ${PJB_DB_READ_VALIDATION_TIMEOUT_MS:5000}
          max-lifetime: ${PJB_DB_READ_MAX_LIFETIME_MS:1800000}
          leak-detection-threshold: ${PJB_DB_READ_LEAK_DETECTION_MS:0}
          read-only: ${PJB_DB_READ_ONLY:true}
        data-source-properties:
          ApplicationName: ${PJB_DB_READ_APPLICATION_NAME:pjb-read-replica}
          assumeMinServerVersion: ${PJB_DB_READ_ASSUME_MIN_SERVER_VERSION:17}
          connectTimeout: ${PJB_DB_READ_CONNECT_TIMEOUT_SECONDS:10}
          sslmode: ${PJB_DB_READ_SSL_MODE:${PJB_DB_SSL_MODE:prefer}}
          sslrootcert: ${PJB_DB_READ_SSL_ROOT_CERT:${PJB_DB_SSL_ROOT_CERT:}}
          targetServerType: ${PJB_DB_READ_TARGET_SERVER_TYPE:preferSecondary}
          loadBalanceHosts: ${PJB_DB_READ_LOAD_BALANCE_HOSTS:true}
          socketTimeout: ${PJB_DB_READ_SOCKET_TIMEOUT_SECONDS:${PJB_DB_SOCKET_TIMEOUT_SECONDS:120}}
          preparedStatementCacheQueries: ${PJB_DB_READ_PREPARED_CACHE_QUERIES:512}
          preparedStatementCacheSizeMiB: ${PJB_DB_READ_PREPARED_CACHE_MIB:16}
          reWriteBatchedInserts: ${PJB_DB_READ_REWRITE_BATCHED_INSERTS:true}
          binaryTransfer: ${PJB_DB_READ_BINARY_TRANSFER:true}
          tcpKeepAlive: ${PJB_DB_READ_TCP_KEEP_ALIVE:true}
      regional-replicas:
        norte:
          url: ${PJB_DB_READ_NORTE_URL:}
          username: ${PJB_DB_READ_NORTE_USER:${PJB_DB_READ_USER:}}
          password: ${PJB_DB_READ_NORTE_PASS:${PJB_DB_READ_PASS:}}
          driver-class-name: ${PJB_DB_READ_NORTE_DRIVER:${PJB_DB_READ_DRIVER:}}
        nordeste:
          url: ${PJB_DB_READ_NE_URL:}
          username: ${PJB_DB_READ_NE_USER:${PJB_DB_READ_USER:}}
          password: ${PJB_DB_READ_NE_PASS:${PJB_DB_READ_PASS:}}
          driver-class-name: ${PJB_DB_READ_NE_DRIVER:${PJB_DB_READ_DRIVER:}}
        centro-oeste:
          url: ${PJB_DB_READ_CO_URL:}
          username: ${PJB_DB_READ_CO_USER:${PJB_DB_READ_USER:}}
          password: ${PJB_DB_READ_CO_PASS:${PJB_DB_READ_PASS:}}
          driver-class-name: ${PJB_DB_READ_CO_DRIVER:${PJB_DB_READ_DRIVER:}}
        sudeste:
          url: ${PJB_DB_READ_SE_URL:}
          username: ${PJB_DB_READ_SE_USER:${PJB_DB_READ_USER:}}
          password: ${PJB_DB_READ_SE_PASS:${PJB_DB_READ_PASS:}}
          driver-class-name: ${PJB_DB_READ_SE_DRIVER:${PJB_DB_READ_DRIVER:}}
        sul:
          url: ${PJB_DB_READ_SUL_URL:}
          username: ${PJB_DB_READ_SUL_USER:${PJB_DB_READ_USER:}}
          password: ${PJB_DB_READ_SUL_PASS:${PJB_DB_READ_PASS:}}
          driver-class-name: ${PJB_DB_READ_SUL_DRIVER:${PJB_DB_READ_DRIVER:}}
        superior:
          url: ${PJB_DB_READ_SUPERIOR_URL:}
          username: ${PJB_DB_READ_SUPERIOR_USER:${PJB_DB_READ_USER:}}
          password: ${PJB_DB_READ_SUPERIOR_PASS:${PJB_DB_READ_PASS:}}
          driver-class-name: ${PJB_DB_READ_SUPERIOR_DRIVER:${PJB_DB_READ_DRIVER:}}
      regional-selection:
        enabled: ${PJB_DB_READ_REGIONAL_SELECTION_ENABLED:true}
        request-header-replica: ${PJB_DB_READ_REQUEST_HEADER_REPLICA:X-PJB-Read-Replica}
        request-header-tribunal: ${PJB_DB_READ_REQUEST_HEADER_TRIBUNAL:X-PJB-Tribunal}
        request-header-uf: ${PJB_DB_READ_REQUEST_HEADER_UF:X-PJB-UF}
        tribunal-to-replica:
          STJ: SUPERIOR
          STF: SUPERIOR
          TSE: SUPERIOR
          TST: SUPERIOR
          STM: SUPERIOR
          CNJ: SUPERIOR
        uf-to-replica:
          AC: NORTE
          AL: NORDESTE
          AM: NORTE
          AP: NORTE
          BA: NORDESTE
          CE: NORDESTE
          DF: CENTRO_OESTE
          ES: SUDESTE
          GO: CENTRO_OESTE
          MA: NORDESTE
          MG: SUDESTE
          MS: CENTRO_OESTE
          MT: CENTRO_OESTE
          PA: NORTE
          PB: NORDESTE
          PE: NORDESTE
          PI: NORDESTE
          PR: SUL
          RJ: SUDESTE
          RN: NORDESTE
          RO: NORTE
          RR: NORTE
          RS: SUL
          SC: SUL
          SE: NORDESTE
          SP: SUDESTE
          TO: NORTE
      observability:
        refresh-ttl: ${PJB_DB_READ_OBSERVABILITY_REFRESH_TTL:5s}
        connection-timeout: ${PJB_DB_READ_OBSERVABILITY_CONNECTION_TIMEOUT:2s}
        statement-timeout: ${PJB_DB_READ_OBSERVABILITY_STATEMENT_TIMEOUT:2s}
      adaptive-plane:
        enabled: ${PJB_DB_ADAPTIVE_PLANE_ENABLED:true}
        emit-response-headers: ${PJB_DB_ADAPTIVE_PLANE_EMIT_HEADERS:true}
        replica-lag-tolerance: ${PJB_DB_ADAPTIVE_PLANE_REPLICA_LAG_TOLERANCE:2s}
        degraded-replica-lag-tolerance: ${PJB_DB_ADAPTIVE_PLANE_DEGRADED_LAG_TOLERANCE:6s}
        read-pool-active-ratio-threshold: ${PJB_DB_ADAPTIVE_PLANE_READ_ACTIVE_RATIO:0.82}
        write-pool-active-ratio-threshold: ${PJB_DB_ADAPTIVE_PLANE_WRITE_ACTIVE_RATIO:0.90}
        read-pool-awaiting-threshold: ${PJB_DB_ADAPTIVE_PLANE_READ_AWAITING:8}
        write-pool-awaiting-threshold: ${PJB_DB_ADAPTIVE_PLANE_WRITE_AWAITING:16}
        primary-critical-prefixes:
          - /api/v1/processos
          - /api/v1/peticionamento
          - /api/v1/protocolos
          - /api/v1/documentos/assinatura
          - /api/v1/comunicacoes
        hot-cache-prefixes:
          - /api/v1/dashboard
          - /api/v1/painel
          - /api/v1/timeline
          - /api/v1/agenda
          - /api/v1/processos/resumo
          - /api/v1/caixas
        search-backed-prefixes:
          - /api/v1/busca
          - /api/v1/search
          - /api/v1/elastic
          - /api/v1/indexacao
        async-write-prefixes:
          - /api/v1/documentos/upload
          - /api/v1/anexos
          - /api/v1/reprocessamento
          - /api/v1/eventos
          - /api/v1/integracoes
      sovereign-fallback:
        enabled: ${PJB_DB_SOVEREIGN_FALLBACK_ENABLED:true}
        force-primary-on-critical-exhaustion: ${PJB_DB_SOVEREIGN_FORCE_PRIMARY:true}
        regional-replica-lag-tolerance: ${PJB_DB_SOVEREIGN_LAG_TOLERANCE:4s}
        scope-to-fallback-replica:
          NORTE: CENTRO_OESTE
          NORDESTE: SUDESTE
          CENTRO_OESTE: SUDESTE
          SUL: SUDESTE
          SUDESTE: READ
          SUPERIOR: SUPERIOR
      processual-read-models:
        enabled: ${PJB_PROCESSUAL_READ_MODELS_ENABLED:true}
        emit-response-headers: ${PJB_PROCESSUAL_READ_MODELS_EMIT_HEADERS:true}
        persistence-enabled: ${PJB_PROCESSUAL_READ_MODELS_PERSISTENCE_ENABLED:true}
        kafka-topic: ${PJB_PROCESSUAL_READ_MODELS_KAFKA_TOPIC:pjb.processual.read-models.v1}
        recomposition-batch-size: ${PJB_PROCESSUAL_READ_MODELS_RECOMPOSITION_BATCH_SIZE:25}
        recomposition-max-attempts: ${PJB_PROCESSUAL_READ_MODELS_RECOMPOSITION_MAX_ATTEMPTS:5}
        recomposition-poll-ms: ${PJB_PROCESSUAL_READ_MODELS_RECOMPOSITION_POLL_MS:20000}
        recomposition-retry-delay: ${PJB_PROCESSUAL_READ_MODELS_RECOMPOSITION_RETRY_DELAY:30s}
      write-failover:
        enabled: ${PJB_DB_WRITE_FAILOVER_ENABLED:false}
        strict: ${PJB_DB_WRITE_FAILOVER_STRICT:false}
        failure-cooldown: ${PJB_DB_WRITE_FAILOVER_FAILURE_COOLDOWN:10s}
        success-stickiness: ${PJB_DB_WRITE_FAILOVER_SUCCESS_STICKINESS:20s}
        candidates:
          secondary-a:
            url: ${PJB_DB_WRITE_FAILOVER_SECONDARY_A_URL:}
            username: ${PJB_DB_WRITE_FAILOVER_SECONDARY_A_USER:${PJB_DB_USER:}}
            password: ${PJB_DB_WRITE_FAILOVER_SECONDARY_A_PASS:${PJB_DB_PASS:}}
            driver-class-name: ${PJB_DB_WRITE_FAILOVER_SECONDARY_A_DRIVER:org.postgresql.Driver}
          secondary-b:
            url: ${PJB_DB_WRITE_FAILOVER_SECONDARY_B_URL:}
            username: ${PJB_DB_WRITE_FAILOVER_SECONDARY_B_USER:${PJB_DB_USER:}}
            password: ${PJB_DB_WRITE_FAILOVER_SECONDARY_B_PASS:${PJB_DB_PASS:}}
            driver-class-name: ${PJB_DB_WRITE_FAILOVER_SECONDARY_B_DRIVER:org.postgresql.Driver}
  cache:
    redis:
      enabled: ${PJB_CACHE_REDIS_ENABLED:false}
      default-ttl: ${PJB_CACHE_REDIS_DEFAULT_TTL:15m}
    local:
      default-ttl: ${PJB_CACHE_LOCAL_DEFAULT_TTL:15m}
      default-maximum-size: ${PJB_CACHE_LOCAL_DEFAULT_MAXIMUM_SIZE:10000}
    ttl:
      cidadaoPainel: ${PJB_CACHE_TTL_CIDADAO_PAINEL:10s}
      govHubByUf: ${PJB_CACHE_TTL_GOV_HUB:1h}
      comJudStateByKey: ${PJB_CACHE_TTL_COMJUD_STATE_BY_KEY:45s}
      comJudStateByDomain: ${PJB_CACHE_TTL_COMJUD_STATE_BY_DOMAIN:20s}
      comJudStateBySecondary: ${PJB_CACHE_TTL_COMJUD_STATE_BY_SECONDARY:20s}
      comJudStateByProcesso: ${PJB_CACHE_TTL_COMJUD_STATE_BY_PROCESSO:20s}
      comJudStateByStatus: ${PJB_CACHE_TTL_COMJUD_STATE_BY_STATUS:20s}
      juiz_painel: ${PJB_CACHE_TTL_JUIZ_PAINEL:2m}
      juiz_kanban: ${PJB_CACHE_TTL_JUIZ_KANBAN:90s}
      desembargador_painel: ${PJB_CACHE_TTL_DESEMBARGADOR_PAINEL:2m}
      desembargador_governanca: ${PJB_CACHE_TTL_DESEMBARGADOR_GOVERNANCA:3m}
      public_timeline: ${PJB_CACHE_TTL_PUBLIC_TIMELINE:5m}
      consultaPublicaWorkspace: ${PJB_CACHE_TTL_CONSULTA_PUBLICA_WORKSPACE:20s}
      consultaPublicaSearch: ${PJB_CACHE_TTL_CONSULTA_PUBLICA_SEARCH:15s}
      consultaPublicaProcessDetail: ${PJB_CACHE_TTL_CONSULTA_PUBLICA_PROCESS_DETAIL:25s}
      consultaPublicaPageResolve: ${PJB_CACHE_TTL_CONSULTA_PUBLICA_PAGE_RESOLVE:5m}
      jurisprudencia_semantica: ${PJB_CACHE_TTL_JURISPRUDENCIA_SEMANTICA:6h}
      perito_disponibilidade: ${PJB_CACHE_TTL_PERITO_DISPONIBILIDADE:15m}
      processo_analytics_ramo: ${PJB_CACHE_TTL_ANALYTICS_RAMO:10m}
      processo_analytics_tribunal: ${PJB_CACHE_TTL_ANALYTICS_TRIBUNAL:10m}
      jurimetria_relatorio: ${PJB_CACHE_TTL_JURIMETRIA_RELATORIO:15m}
    maximum-size:
      cidadaoPainel: ${PJB_CACHE_MAX_CIDADAO_PAINEL:5000}
      govHubByUf: ${PJB_CACHE_MAX_GOV_HUB:256}
      comJudStateByKey: ${PJB_CACHE_MAX_COMJUD_STATE_BY_KEY:5000}
      comJudStateByDomain: ${PJB_CACHE_MAX_COMJUD_STATE_BY_DOMAIN:1000}
      comJudStateBySecondary: ${PJB_CACHE_MAX_COMJUD_STATE_BY_SECONDARY:1000}
      comJudStateByProcesso: ${PJB_CACHE_MAX_COMJUD_STATE_BY_PROCESSO:5000}
      comJudStateByStatus: ${PJB_CACHE_MAX_COMJUD_STATE_BY_STATUS:1000}
      juiz_painel: ${PJB_CACHE_MAX_JUIZ_PAINEL:5000}
      juiz_kanban: ${PJB_CACHE_MAX_JUIZ_KANBAN:5000}
      desembargador_painel: ${PJB_CACHE_MAX_DESEMBARGADOR_PAINEL:5000}
      desembargador_governanca: ${PJB_CACHE_MAX_DESEMBARGADOR_GOVERNANCA:2000}
      public_timeline: ${PJB_CACHE_MAX_PUBLIC_TIMELINE:10000}
      consultaPublicaWorkspace: ${PJB_CACHE_MAX_CONSULTA_PUBLICA_WORKSPACE:5000}
      consultaPublicaSearch: ${PJB_CACHE_MAX_CONSULTA_PUBLICA_SEARCH:15000}
      consultaPublicaProcessDetail: ${PJB_CACHE_MAX_CONSULTA_PUBLICA_PROCESS_DETAIL:10000}
      consultaPublicaPageResolve: ${PJB_CACHE_MAX_CONSULTA_PUBLICA_PAGE_RESOLVE:20000}
      jurisprudencia_semantica: ${PJB_CACHE_MAX_JURISPRUDENCIA_SEMANTICA:2000}
      perito_disponibilidade: ${PJB_CACHE_MAX_PERITO_DISPONIBILIDADE:2000}
      processo_analytics_ramo: ${PJB_CACHE_MAX_ANALYTICS_RAMO:500}
      processo_analytics_tribunal: ${PJB_CACHE_MAX_ANALYTICS_TRIBUNAL:1000}
      jurimetria_relatorio: ${PJB_CACHE_MAX_JURIMETRIA_RELATORIO:200}
    enabled: ${PJB_CACHE_ENABLED:true}
    redisson-config: ${PJB_REDISSON_CONFIG:classpath:redisson.yml}
    redisson-config-path: ${PJB_REDISSON_CONFIG_PATH:}

  processual:
    calculo:
      agent-mesh:
        timeout: ${PJB_PROCESSUAL_CALCULO_AGENT_MESH_TIMEOUT:5s}
    recursal:
      ai-mesh:
        timeout: ${PJB_PROCESSUAL_RECURSAL_AI_MESH_TIMEOUT:5s}


  outbox:
    strictTypes: ${PJB_OUTBOX_STRICT_TYPES:false}
    ingress:
      enabled: ${PJB_OUTBOX_INGRESS_ENABLED:true}
      capacity: ${PJB_OUTBOX_INGRESS_CAPACITY:4096}
      flush-batch-size: ${PJB_OUTBOX_INGRESS_FLUSH_BATCH:128}
      flush-interval: ${PJB_OUTBOX_INGRESS_FLUSH_INTERVAL:100ms}
      offer-timeout: ${PJB_OUTBOX_INGRESS_OFFER_TIMEOUT:25ms}
      fallback-to-direct-persist: ${PJB_OUTBOX_INGRESS_DIRECT_FALLBACK:true}
      fail-fast-when-saturated: ${PJB_OUTBOX_INGRESS_FAIL_FAST:false}
      history-limit: ${PJB_OUTBOX_INGRESS_HISTORY_LIMIT:1024}
      max-payload-bytes: ${PJB_OUTBOX_INGRESS_MAX_PAYLOAD_BYTES:524288}
      max-headers-bytes: ${PJB_OUTBOX_INGRESS_MAX_HEADERS_BYTES:32768}
      max-metadata-entries: ${PJB_OUTBOX_INGRESS_MAX_METADATA_ENTRIES:64}
      max-string-length: ${PJB_OUTBOX_INGRESS_MAX_STRING_LENGTH:4096}
      flush-burst-limit: ${PJB_OUTBOX_INGRESS_FLUSH_BURST_LIMIT:8}
    observability:
      enabled: ${PJB_OUTBOX_OBSERVABILITY_ENABLED:true}
      refresh-interval: ${PJB_OUTBOX_OBSERVABILITY_REFRESH_INTERVAL:30s}
      failed-threshold: ${PJB_OUTBOX_OBSERVABILITY_FAILED_THRESHOLD:100}
      inflight-stale-after: ${PJB_OUTBOX_OBSERVABILITY_INFLIGHT_STALE_AFTER:5m}
      pending-lag-after: ${PJB_OUTBOX_OBSERVABILITY_PENDING_LAG_AFTER:10m}

  authz:
    analytics:
      refresh:
        enabled: ${PJB_AUTHZ_ANALYTICS_REFRESH_ENABLED:true}
        fixed-rate-ms: ${PJB_AUTHZ_ANALYTICS_REFRESH_FIXED_RATE_MS:5000}
        processing-timeout-ms: ${PJB_AUTHZ_ANALYTICS_REFRESH_PROCESSING_TIMEOUT_MS:300000}
        cleanup-fixed-rate-ms: ${PJB_AUTHZ_ANALYTICS_REFRESH_CLEANUP_FIXED_RATE_MS:3600000}
        batch-size: ${PJB_AUTHZ_ANALYTICS_REFRESH_BATCH_SIZE:64}
        max-backfill-buckets: ${PJB_AUTHZ_ANALYTICS_REFRESH_MAX_BACKFILL_BUCKETS:4096}
        completion-retention-days: ${PJB_AUTHZ_ANALYTICS_REFRESH_COMPLETION_RETENTION_DAYS:30}

  ops:
    prune:
      enabled: ${PJB_OPS_PRUNE_ENABLED:true}
      retentionDays: ${PJB_OPS_PRUNE_RETENTION_DAYS:7}


management:
  health:
    elasticsearch:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,pjbRuntimePressure
      show-details: when_authorized
  info:
    env:
      enabled: false
