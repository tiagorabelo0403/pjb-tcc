resilience4j:
  retry:
    instances:
      mni-remessa:
        max-attempts: ${PJB_R4J_MNI_MAX_ATTEMPTS:5}
        wait-duration: ${PJB_R4J_MNI_WAIT:2s}
        exponential-backoff-multiplier: 2
      datajud-feed:
        max-attempts: ${PJB_R4J_DATAJUD_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_DATAJUD_WAIT:3s}
      sisbajud-bloqueio:
        max-attempts: ${PJB_R4J_SISBAJUD_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_SISBAJUD_WAIT:5s}
      infojud-consulta:
        max-attempts: ${PJB_R4J_INFOJUD_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_INFOJUD_WAIT:3s}
      renajud-restricao:
        max-attempts: ${PJB_R4J_RENAJUD_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_RENAJUD_WAIT:5s}
      anthropic-dreaming:
        max-attempts: ${PJB_R4J_ANTHROPIC_DREAMING_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_ANTHROPIC_DREAMING_WAIT:2s}
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.tcc.pjb.backend.ai.legalai.dreaming.infra.AnthropicRetryableApiException
      anthropic-memory:
        max-attempts: ${PJB_R4J_ANTHROPIC_MEMORY_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_ANTHROPIC_MEMORY_WAIT:2s}
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.tcc.pjb.backend.ai.legalai.dreaming.infra.AnthropicRetryableApiException
      mni:
        max-attempts: ${PJB_R4J_MNI_CONNECTOR_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_MNI_CONNECTOR_WAIT:2s}
        exponential-backoff-multiplier: 2
      pjemni:
        max-attempts: ${PJB_R4J_PJEMNI_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_PJEMNI_WAIT:2s}
        exponential-backoff-multiplier: 2
      pdpj:
        max-attempts: ${PJB_R4J_PDPJ_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_PDPJ_WAIT:2s}
        exponential-backoff-multiplier: 2
      esaj:
        max-attempts: ${PJB_R4J_ESAJ_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_ESAJ_WAIT:3s}
        exponential-backoff-multiplier: 2
      eproc:
        max-attempts: ${PJB_R4J_EPROC_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_EPROC_WAIT:3s}
        exponential-backoff-multiplier: 2
      projudi:
        max-attempts: ${PJB_R4J_PROJUDI_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_PROJUDI_WAIT:3s}
        exponential-backoff-multiplier: 2
      creta:
        max-attempts: ${PJB_R4J_CRETA_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_CRETA_WAIT:3s}
        exponential-backoff-multiplier: 2
      mp:
        max-attempts: ${PJB_R4J_MP_CONNECTOR_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_MP_CONNECTOR_WAIT:3s}
        exponential-backoff-multiplier: 2
      judicial-connector-lifecycle:
        max-attempts: ${PJB_R4J_JUDICIAL_LIFECYCLE_MAX_ATTEMPTS:3}
        wait-duration: ${PJB_R4J_JUDICIAL_LIFECYCLE_WAIT:2s}
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      mni-remessa:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_MNI_WAIT:60s}
        permitted-number-of-calls-in-half-open-state: 3
      sisbajud-bloqueio:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: ${PJB_CB_SISBAJUD_WAIT:120s}
      anthropic-memory:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_ANTHROPIC_MEMORY_WAIT:30s}
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - java.lang.Exception
      anthropic-dreaming:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_ANTHROPIC_DREAMING_WAIT:60s}
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - java.lang.Exception
      datajud-feed:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_DATAJUD_WAIT:120s}
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - java.lang.Exception
      salario-minimo-bcb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_SALARIO_MINIMO_BCB_WAIT:120s}
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - java.lang.Exception
      infojud-consulta:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: ${PJB_CB_INFOJUD_WAIT:60s}
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - java.lang.Exception
      renajud-restricao:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: ${PJB_CB_RENAJUD_WAIT:120s}
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - java.lang.Exception
      bnmp-registro:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_BNMP_WAIT:120s}
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - java.lang.Exception
      mni:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_MNI_CONNECTOR_WAIT:60s}
        permitted-number-of-calls-in-half-open-state: 3
      pjemni:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_PJEMNI_WAIT:60s}
        permitted-number-of-calls-in-half-open-state: 3
      pdpj:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_PDPJ_WAIT:60s}
        permitted-number-of-calls-in-half-open-state: 3
      esaj:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_ESAJ_WAIT:60s}
        permitted-number-of-calls-in-half-open-state: 2
      eproc:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_EPROC_WAIT:60s}
        permitted-number-of-calls-in-half-open-state: 2
      projudi:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_PROJUDI_WAIT:60s}
        permitted-number-of-calls-in-half-open-state: 2
      creta:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_CRETA_WAIT:60s}
        permitted-number-of-calls-in-half-open-state: 2
      mp:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_MP_CONNECTOR_WAIT:60s}
        permitted-number-of-calls-in-half-open-state: 2
      judicial-connector-lifecycle:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${PJB_CB_JUDICIAL_LIFECYCLE_WAIT:60s}
        permitted-number-of-calls-in-half-open-state: 3
  bulkhead:
    instances:
      mni-remessa:
        max-concurrent-calls: ${PJB_BH_MNI_MAX:20}
        max-wait-duration: 2s
      sisbajud-bloqueio:
        max-concurrent-calls: ${PJB_BH_SISBAJUD_MAX:10}
        max-wait-duration: 2s
      datajud-feed:
        max-concurrent-calls: ${PJB_BH_DATAJUD_MAX:5}
        max-wait-duration: 2s
      infojud-consulta:
        max-concurrent-calls: ${PJB_BH_INFOJUD_MAX:10}
        max-wait-duration: 2s
      renajud-restricao:
        max-concurrent-calls: ${PJB_BH_RENAJUD_MAX:10}
        max-wait-duration: 2s
      bnmp-registro:
        max-concurrent-calls: ${PJB_BH_BNMP_MAX:5}
        max-wait-duration: 1s
      judicial-connector-lifecycle:
        max-concurrent-calls: ${PJB_BH_JUDICIAL_LIFECYCLE_MAX:15}
        max-wait-duration: 2s
