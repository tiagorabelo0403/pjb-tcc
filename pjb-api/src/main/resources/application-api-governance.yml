pjb:
  api:
    surface:
      enabled: true
      max-request-uri-length: ${PJB_API_SURFACE_MAX_URI_LENGTH:4096}
      max-query-string-length: ${PJB_API_SURFACE_MAX_QUERY_LENGTH:4096}
      max-header-count: ${PJB_API_SURFACE_MAX_HEADER_COUNT:120}
      max-header-value-length: ${PJB_API_SURFACE_MAX_HEADER_VALUE_LENGTH:4096}
      max-parameter-count: ${PJB_API_SURFACE_MAX_PARAMETER_COUNT:200}
      max-request-id-length: ${PJB_API_SURFACE_MAX_REQUEST_ID_LENGTH:80}
      reject-backslash-path: ${PJB_API_SURFACE_REJECT_BACKSLASH:true}
      reject-path-traversal-tokens: ${PJB_API_SURFACE_REJECT_TRAVERSAL:true}
      reject-double-slash-path: ${PJB_API_SURFACE_REJECT_DOUBLE_SLASH:true}
    route-governance:
      enabled: ${PJB_API_ROUTE_GOVERNANCE_ENABLED:true}
      default-max-page-size: ${PJB_API_ROUTE_GOVERNANCE_DEFAULT_MAX_PAGE_SIZE:200}
      default-max-request-bytes: ${PJB_API_ROUTE_GOVERNANCE_DEFAULT_MAX_REQUEST_BYTES:1048576}
      default-max-path-segments: ${PJB_API_ROUTE_GOVERNANCE_DEFAULT_MAX_PATH_SEGMENTS:24}
      default-max-offset: ${PJB_API_ROUTE_GOVERNANCE_DEFAULT_MAX_OFFSET:10000}
      exempt-prefixes: ["/actuator/health", "/livez", "/readyz", "/startupz"]
      rules:
        - name: all-api
          paths: ["/api/**"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
          max-page-size: ${PJB_API_ROUTE_GOVERNANCE_ALL_MAX_PAGE_SIZE:200}
          max-request-bytes: ${PJB_API_ROUTE_GOVERNANCE_ALL_MAX_REQUEST_BYTES:1048576}
          max-path-segments: ${PJB_API_ROUTE_GOVERNANCE_ALL_MAX_PATH_SEGMENTS:24}
          max-offset: ${PJB_API_ROUTE_GOVERNANCE_ALL_MAX_OFFSET:10000}
          max-requests-per-window: ${PJB_API_ROUTE_GOVERNANCE_ALL_RATE_LIMIT:1200}
          rate-window-seconds: ${PJB_API_ROUTE_GOVERNANCE_ALL_RATE_WINDOW:60}
          rate-limit-key-strategy: ip
        - name: admin-governance
          paths: ["/api/admin/**", "/api/v1/admin/**"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
          authorities: ["ROLE_ADMIN", "ROLE_ADMINISTRADOR"]
          max-page-size: ${PJB_API_ROUTE_GOVERNANCE_ADMIN_MAX_PAGE_SIZE:100}
          max-request-bytes: ${PJB_API_ROUTE_GOVERNANCE_ADMIN_MAX_REQUEST_BYTES:524288}
          max-path-segments: ${PJB_API_ROUTE_GOVERNANCE_ADMIN_MAX_PATH_SEGMENTS:20}
          max-offset: ${PJB_API_ROUTE_GOVERNANCE_ADMIN_MAX_OFFSET:2000}
          allowed-content-types: ["application/json", "application/merge-patch+json", "application/x-www-form-urlencoded", "multipart/form-data"]
          max-requests-per-window: ${PJB_API_ROUTE_GOVERNANCE_ADMIN_RATE_LIMIT:120}
          rate-window-seconds: ${PJB_API_ROUTE_GOVERNANCE_ADMIN_RATE_WINDOW:60}
          rate-limit-key-strategy: ip_user
          no-store-response: true
        - name: judge-delegation
          paths: ["/api/v1/judge/delegation/**"]
          methods: ["GET", "POST", "PUT", "PATCH"]
          authorities: ["ROLE_MAGISTRADO", "ROLE_JUIZ", "ROLE_JUIZ_ESTADUAL", "ROLE_JUIZ_FEDERAL", "ROLE_JUIZ_TRABALHISTA", "ROLE_JUIZ_ELEITORAL", "ROLE_JUIZ_MILITAR", "ROLE_DESEMBARGADOR", "ROLE_DESEMBARGADOR_FEDERAL", "ROLE_MINISTRO", "ROLE_ASSESSOR_JUDICIAL", "ROLE_ASSESSOR_DESEMBARGADOR", "ROLE_ASSESSOR_MINISTRO"]
          max-page-size: ${PJB_API_ROUTE_GOVERNANCE_JUDGE_DELEGATION_MAX_PAGE_SIZE:100}
          max-request-bytes: ${PJB_API_ROUTE_GOVERNANCE_JUDGE_DELEGATION_MAX_REQUEST_BYTES:262144}
          max-path-segments: ${PJB_API_ROUTE_GOVERNANCE_JUDGE_DELEGATION_MAX_PATH_SEGMENTS:20}
          max-offset: ${PJB_API_ROUTE_GOVERNANCE_JUDGE_DELEGATION_MAX_OFFSET:1000}
